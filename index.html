    if (this.env) return this.env;
    const r = this.el.sceneEl.renderer, s = new THREE.Scene();
    s.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.MeshBasicMaterial({ color: '#0c1a36', side: THREE.BackSide })));
    const lamp = (w, h, x, y, z, c = '#ffffff') => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
    lamp(8, 0.4, 0, 6, 0); lamp(14, 0.3, 0, -3, 8, '#cfe0ff'); lamp(14, 0.3, 0, -3, -8, '#cfe0ff'); lamp(0.6, 6, 8, 1, 0, '#9fb8ff'); lamp(0.6, 6, -8, 1, 0, '#9fb8ff');
    const pm = new THREE.PMREMGenerator(r); this.env = pm.fromScene(s, 0.02).texture; pm.dispose();
    return this.env;
  },

  loadLogo() {
    const e = document.createElement('a-entity');
    e.setAttribute('gltf-model', `url(${this.data.logo})`);
    e.addEventListener('model-loaded', ev => {
      const m = ev.detail.model;
      e.object3D.rotation.y = 0;                       // measure un-spun (the entity may already be rotating)
      e.object3D.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
      const c = e.object3D.worldToLocal(box.getCenter(new THREE.Vector3()));          // centre in the entity's local space
      const holder = new THREE.Group(); holder.add(m); m.position.sub(c);              // centre
      if (size.z > size.x) holder.rotation.y = Math.PI / 2;                           // text width along X
      const w = Math.max(size.x, size.z); holder.scale.setScalar(LOBBY.logoW / w);
      const env = this.envMap();
      let noTex = false;
      m.traverse(o => { if (!o.isMesh) return;
        const mt = o.material; o.castShadow = true; mt.envMap = env; mt.envMapIntensity = 1.4;
        // neon: the letters light themselves – green faces and silver rims glow (emissive = base colour texture)
        if (mt.map) {                                   // textured logo (deyan_logo.glb): faces + rims glow in their own colours
          mt.emissiveMap = mt.map; mt.emissive = new THREE.Color('#ffffff'); mt.emissiveIntensity = 0.7;
        } else {                                        // logo without textures – still green neon, never blown-out white
          mt.color = new THREE.Color('#7cf21c'); mt.metalness = 0.35; mt.roughness = 0.3;
          mt.emissive = new THREE.Color('#4fc40c'); mt.emissiveIntensity = 0.8; noTex = true;
        }
        mt.needsUpdate = true; });
      if (noTex) document.dispatchEvent(new CustomEvent('model-error', { detail: { src: `${this.data.logo} (nema teksture – koristi deyan_logo.glb koji sam poslao)` } }));
      e.object3D.add(holder);
      this.addLogoGlow(e.object3D, m);
    });
    e.setAttribute('position', `0 ${LOBBY.logoY} 0`);
    this.el.appendChild(e);
    this.logoEl = e;
  },

  /** Soft neon halo (fake bloom): the logo silhouette is rasterised once into a canvas, blurred and
      shown on an additive plane through the logo, plus a green light that tints the room. */
  addLogoGlow(root, model) {
    root.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(root.matrixWorld).invert(), M = new THREE.Matrix4(), v = new THREE.Vector3();
    const k = LOBBY.logoW / 1.6, PW = 2.1 * k, PH = 0.62 * k, W = 1024, H = Math.round(W * PH / PW);
    const sil = document.createElement('canvas'); sil.width = W; sil.height = H;
    const c = sil.getContext('2d'); c.fillStyle = '#fff';
    model.traverse(o => {
      if (!o.isMesh) return;
      M.multiplyMatrices(inv, o.matrixWorld);
      const pos = o.geometry.getAttribute('position');
      for (let i = 0; i < pos.count; i += 3) {
        v.fromBufferAttribute(pos, i).applyMatrix4(M);
        c.fillRect((v.x / PW + 0.5) * W - 1.5, (0.5 - v.y / PH) * H - 1.5, 3, 3);
      }
    });
    const blur = (src, f, passes) => {                          // portable blur: down-/up-sampling
      let cur = src;
      for (let k = 0; k < passes; k++) {
        const sm = document.createElement('canvas'); sm.width = Math.max(1, W / f); sm.height = Math.max(1, H / f);
        const sc = sm.getContext('2d'); sc.imageSmoothingQuality = 'high'; sc.drawImage(cur, 0, 0, sm.width, sm.height);
        const up = document.createElement('canvas'); up.width = W; up.height = H;
        const uc = up.getContext('2d'); uc.imageSmoothingQuality = 'high'; uc.drawImage(sm, 0, 0, W, H); cur = up;
      }
      return cur;
    };
    const tint = (src, color, alpha) => { const t = document.createElement('canvas'); t.width = W; t.height = H;
      const tc = t.getContext('2d'); tc.drawImage(src, 0, 0); tc.globalCompositeOperation = 'source-in'; tc.fillStyle = color; tc.fillRect(0, 0, W, H);
      return [t, alpha]; };
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const oc = out.getContext('2d'); oc.globalCompositeOperation = 'lighter';
    for (const [layer, a] of [tint(blur(sil, 24, 3), '#6fef12', 0.8), tint(blur(sil, 10, 2), '#9cff3a', 0.55), tint(blur(sil, 4, 1), '#d8ffb0', 0.25)]) {
      oc.globalAlpha = a; oc.drawImage(layer, 0, 0);
    }
    const tex = new THREE.CanvasTexture(out); tex.colorSpace = THREE.SRGBColorSpace;
    this.glowMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      side: THREE.DoubleSide, toneMapped: false, opacity: 0.9 });
    root.add(new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), this.glowMat));
    this.logoLight = new THREE.PointLight('#8cff2a', 6, 12, 2); root.add(this.logoLight);    // green spill on table / walls / floor
  },

  tick(t, dt) {
    if (!this.el.object3D.visible) return;
    if (this.glowMat) { const pulse = 0.9 + Math.sin(t / 900) * 0.06; this.glowMat.opacity = pulse; this.logoLight.intensity = 6 * pulse; }
    const o = this.logoEl && this.logoEl.object3D; if (!o) return;
    o.rotation.y += (this.data.spin * Math.min(dt, 100)) / 1000;
    o.position.y = LOBBY.logoY + Math.sin(t / 1400) * 0.03;                       // gentle float
  },

  /* ---------- API ---------- */
  groundHeight() { return 0; },

  resolveMove(from, to, r) {
    const L = LOBBY, max = L.R - r - 0.08, min = L.tableR + r + 0.03, d = Math.hypot(to.x, to.z);
    if (d > max) { to.x *= max / d; to.z *= max / d; }                               // slide along the wall
    else if (d < min) { const k = min / Math.max(d, 1e-4); to.x *= k; to.z *= k; }   // slide around the table
  },

  /** Fraction (0–1) along head→camera where the round wall / ceiling is hit, or null. */
  cameraHit(head, cam) {
    const R = LOBBY.R - 0.25, dx = cam.x - head.x, dz = cam.z - head.z;
    const a = dx * dx + dz * dz, b = 2 * (head.x * dx + head.z * dz), c = head.x * head.x + head.z * head.z - R * R;
    let f = 1;
    if (a > 1e-6 && c < 0) { const s = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); if (s < f) f = s; }
    const dy = cam.y - head.y, topY = LOBBY.H - 1.2;
    if (dy > 0 && cam.y > topY) f = Math.min(f, (topY - head.y) / dy);
    return f < 1 ? Math.max(0, f) : null;
  },

  spawnPoints() { return [[0, 2.6], [1.4, 2.2], [-1.4, 2.2], [0.6, -2.4], [-1.6, -1.9]]; }
});

/* =====================================================================
   9) ENV-MANAGER – keys 1 / 2 / 3 switch environments
   1 = pavilion (#pavilion), 2 = glitch forest (#forest), 3 = empty slot.
   ===================================================================== */
const ENVIRONMENTS = [
  { name: 'Pavilion', el: '#pavilion', component: 'pavilion',
    sky: '#D3D3D3', fog: 'type: linear; color: #D3D3D3; near: 18; far: 45',
    hemi: { color: '#ffffff', groundColor: '#8a8a8a', intensity: 1.1 }, ambient: 0.35, sun: { color: '#fff6e8', intensity: 1.6 } },
  { name: 'Glitch Forest', el: '#forest', component: 'glitch-forest',
    sky: '#000000', fog: 'type: linear; color: #000000; near: 7; far: 24',
    hemi: { color: '#8f96ff', groundColor: '#12081f', intensity: 0.75 }, ambient: 0.12, sun: { color: '#b9a8ff', intensity: 0.7 } },
  { name: 'Starry Valley', el: '#valley', component: 'starry-valley', skyVisible: false,
    sky: '#0b1240', fog: 'type: linear; color: #2a3577; near: 90; far: 700',
    hemi: { color: '#e4eeff', groundColor: '#2d4a1f', intensity: 1.35 }, ambient: 0.35, sun: { color: '#fff1d6', intensity: 1.9 },
    spawn: () => document.querySelector('#valley').components['starry-valley'].spawnPoints() },
  { name: 'Megastructure', el: '#mega', component: 'megastructure',
    sky: '#cfc6b6', fog: 'type: linear; color: #c4baa8; near: 12; far: 115',
    hemi: { color: '#efe7da', groundColor: '#5d554b', intensity: 1.05 }, ambient: 0.35, sun: { color: '#fff0d6', intensity: 1.7 },
    spawn: () => document.querySelector('#mega').components.megastructure.spawnPoints() },
  { name: 'Lobby', el: '#lobby', component: 'lobby', key: 0, skyVisible: false,
    sky: '#000000', fog: 'type: linear; color: #000000; near: 60; far: 80',
    hemi: { color: '#a9bfff', groundColor: '#0b1020', intensity: 0.75 }, ambient: 0.18, sun: { color: '#e4ecff', intensity: 0.9 },
    spawn: () => document.querySelector('#lobby').components.lobby.spawnPoints() }
];
const START_ENV = 4;   // lobby is what you see when the website opens
const DEFAULT_SPAWN = [[0, 8], [1.3, 8.5], [-1.3, 8.5], [0, 9.6], [-1.4, 10.1]];

AFRAME.registerComponent('env-manager', {
  init() {
    this.current = -1;
    this.toast = document.createElement('div');
    this.toast.id = 'env-toast';
    document.body.appendChild(this.toast);
    window.addEventListener('keydown', e => {
      if (document.body.classList.contains('modal-open') || e.repeat) return;
      const n = { Digit0: 4, Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad0: 4, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 }[e.code];
      if (n !== undefined) this.select(n);
    });
    this.saved = [];                       // per environment: where every character was
    if (this.el.hasLoaded) this.select(START_ENV, true); else this.el.addEventListener('loaded', () => this.select(START_ENV, true), { once: true });
  },

  /** Active environment's API (groundHeight / resolveMove / cameraHit). */
  world() {
    const env = ENVIRONMENTS[this.current]; if (!env) return null;
    const el = document.querySelector(env.el); return el && el.components[env.component];
  },

  select(n, silent) {
    const env = ENVIRONMENTS[n];
    if (!env) { this.show(`Environment ${n + 1} – empty slot`); return; }
    const label = env.key !== undefined ? env.key : n + 1;
    if (n === this.current) return;
    const players = Array.from(document.querySelectorAll('.player'));
    if (this.current >= 0) this.saved[this.current] = players.map(p => p.object3D.position.clone());   // remember positions
    this.current = n;
    ENVIRONMENTS.forEach((e, i) => {
      if (!e) return;
      const el = document.querySelector(e.el); if (!el) return;
      el.object3D.visible = i === n;
      if (i === n) el.play(); else el.pause();
    });
    const sky = document.querySelector('a-sky');
    if (sky) { sky.setAttribute('color', env.sky); sky.object3D.visible = env.skyVisible !== false; }
    this.el.setAttribute('fog', env.fog);
    const hemi = document.querySelector('#hemiLight'), amb = document.querySelector('#ambLight'), sun = document.querySelector('#sunLight');
    if (hemi) hemi.setAttribute('light', env.hemi);
    if (amb) amb.setAttribute('light', 'intensity', env.ambient);
    if (sun) sun.setAttribute('light', env.sun);
    // restore where the characters were in this environment (or use its spawn points), on its floor
    const w = this.world(), spawn = env.spawn ? env.spawn() : DEFAULT_SPAWN;
    players.forEach((p, i) => {
      const o = p.object3D.position, prev = this.saved[n] && this.saved[n][i];
      if (prev) o.copy(prev); else { const sp = spawn[i % spawn.length]; o.set(sp[0], 0, sp[1]); }
      o.y = w ? w.groundHeight(o.x, o.z, o.y) : 0;
    });
    if (!silent) this.show(`${label} · ${env.name}`);
    this.el.emit('environment-changed', { index: n, name: env.name });
  },

  show(text) {
    this.toast.textContent = text;
    this.toast.classList.add('show');
    clearTimeout(this.tt); this.tt = setTimeout(() => this.toast.classList.remove('show'), 1400);
  }
});

/* =====================================================================
   HAND-SWORD – ogroman mač u desnoj ruci (proceduralan, zakačen za kost šake)
   ===================================================================== */
AFRAME.registerComponent('hand-sword', {
  schema: {
    bone:   { default: 'RightHand' },
    length: { type: 'number', default: 1.25 },   // dužina sječiva (m)
    tilt:   { type: 'number', default: 18 },     // ugao vrha prema dolje (°)
    grip:   { type: 'number', default: 0.085 },  // pomak drške niz prste (m)
    size:   { type: 'number', default: 1.3 }    // uvećanje cijelog mača (ogroman mač)
  },
  init() {
    const go = () => this.attach(this.el.getObject3D('mesh'));
    if (this.el.getObject3D('mesh')) go(); else this.el.addEventListener('model-loaded', go, { once: true });
  },
  build() {
    const L = this.data.length, g = new THREE.Group();
    const steel = new THREE.MeshStandardMaterial({ color: '#c7cdd3', metalness: 0.65, roughness: 0.28 });
    const dark  = new THREE.MeshStandardMaterial({ color: '#6f767d', metalness: 0.6, roughness: 0.45 });
    const brass = new THREE.MeshStandardMaterial({ color: '#8a6a32', metalness: 0.7, roughness: 0.35 });
    const leather = new THREE.MeshStandardMaterial({ color: '#3a2417', metalness: 0, roughness: 0.85 });
    const add = (geo, mat, y = 0) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; g.add(m); return m; };
    // sječivo: širok, blago sužen profil sa šiljkom, oštre ivice (bevel)
    const w0 = 0.075, w1 = 0.06, sh = new THREE.Shape();
    sh.moveTo(-w0, 0); sh.lineTo(-w1, L * 0.86); sh.lineTo(0, L); sh.lineTo(w1, L * 0.86); sh.lineTo(w0, 0); sh.closePath();
    const blade = new THREE.ExtrudeGeometry(sh, { depth: 0.006, bevelEnabled: true, bevelThickness: 0.009, bevelSize: 0.012, bevelSegments: 1, curveSegments: 1 });
    blade.translate(0, 0, -0.003);
    add(blade, steel, 0.17);
    for (const z of [-1, 1]) {                                        // žlijeb (fuller) sa obje strane
      const f = add(new THREE.BoxGeometry(0.026, L * 0.62, 0.004), dark, 0.17 + L * 0.34);
      f.position.z = z * 0.0115;
    }
    const ric = add(new THREE.BoxGeometry(0.17, 0.07, 0.04), brass, 0.205);  // ricasso / osnova
    add(new THREE.BoxGeometry(0.46, 0.045, 0.06), brass, 0.15);              // štitnik (crossguard)
    for (const x of [-1, 1]) { const k = add(new THREE.SphereGeometry(0.038, 12, 8), brass, 0.15); k.position.x = x * 0.23; }
    add(new THREE.CylinderGeometry(0.019, 0.022, 0.36, 12), leather, -0.03); // drška
    for (let i = 0; i < 8; i++) add(new THREE.TorusGeometry(0.021, 0.004, 6, 14), leather, -0.18 + i * 0.045).rotation.x = Math.PI / 2;
    add(new THREE.SphereGeometry(0.045, 14, 10), brass, -0.235);           // jabučica (pommel)
    return g;
  },
  attach(model) {
    if (!model) return;
    let skinned = null; model.traverse(o => { if (o.isSkinnedMesh && !skinned) skinned = o; });
    const re = new RegExp(this.data.bone + '(_\\d+)?$');
    const bones = skinned ? skinned.skeleton.bones : [];
    const hand = bones.find(b => re.test(b.name));
    if (!hand) return console.warn('[hand-sword] Kost šake nije pronađena.');
    model.updateMatrixWorld(true);
    const ws = new THREE.Vector3(); hand.getWorldScale(ws);
    // Ose šake se računaju iz kostiju prstiju (rig iz Cinema 4D nema standardnu Mixamo orijentaciju):
    // f = pravac prstiju, th = pravac palca (okomito na prste) – drška ide kroz pesnicu; sječivo izlazi sa strane malog prsta (naprijed u ovom rigu).
    const kid = r => hand.children.find(c => r.test(c.name));
    const mid = kid(/middle1/i) || kid(/index1/i), th0 = kid(/thumb1/i);
    const f = mid ? mid.position.clone().normalize() : new THREE.Vector3(0, 1, 0);
    const tp = th0 ? th0.position.clone() : new THREE.Vector3(1, 0, 0);
    const th = tp.sub(f.clone().multiplyScalar(tp.dot(f))).normalize();
    const t = THREE.MathUtils.degToRad(this.data.tilt);                      // vrh blago prema dolje (ka prstima)
    const d = th.clone().multiplyScalar(-Math.cos(t)).add(f.clone().multiplyScalar(Math.sin(t))).normalize();   // pravac sječiva
    const w = f.clone().sub(d.clone().multiplyScalar(f.dot(d))).normalize();                                  // širina sječiva (oštrica)
    const z = new THREE.Vector3().crossVectors(w, d);
    const sword = this.build();
    sword.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(w, d, z));
    sword.scale.setScalar(this.data.size / ws.x);
    // drška u sredini dlana: dio puta do korijena prstiju
    const palm = mid ? mid.position.clone().multiplyScalar(0.55) : new THREE.Vector3(0, this.data.grip / ws.x, 0);
    sword.position.copy(palm);
    hand.add(sword);
    this.sword = sword;
  }
});

/* Karakter bez teksture (npr. pogrešan / stari .glb u folderu) -> crvena poruka sa imenom fajla */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.character').forEach(el => el.addEventListener('model-loaded', () => setTimeout(() => {
    if (el.hasAttribute('model-texture')) return;                 // tekstura se dodaje posebnim fajlom
    let tex = false; el.getObject3D('mesh').traverse(o => { if (o.isMesh && o.material && o.material.map) tex = true; });
    if (tex) return;
    const a = document.querySelector(el.getAttribute('gltf-model')), src = a ? a.getAttribute('src') : el.getAttribute('gltf-model');
    document.dispatchEvent(new CustomEvent('model-error', { detail: { src: `${src} (učitan je fajl BEZ tekstura – zamijeni ga fajlom koji sam poslao)` } }));
  }, 1500)));
});

/* Vidljiva poruka ako neki 3D fajl ne može da se učita (pogrešno ime / fajl nije u folderu) */
document.addEventListener('model-error', e => {
  let box = document.getElementById('load-errors');
  if (!box) {
    box = document.createElement('div'); box.id = 'load-errors';
    box.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;background:#b3261e;color:#fff;font:13px system-ui,sans-serif;padding:8px 14px;border-radius:8px;max-width:90vw';
    document.body.appendChild(box);
  }
  const src = (e.detail && e.detail.src) || '?';
  box.innerHTML += `<div>Ne mogu da učitam <b>${src}</b> – provjeri da je fajl u istom folderu kao index.html i da se tačno tako zove.</div>`;
});
</script>

<a-scene
  glasses-viewer="pavilion: #pavilion"
  env-manager
  renderer="antialias: true"
  shadow="type: pcf"
  fog="type: linear; color: #D3D3D3; near: 18; far: 45"
  loading-screen="dotsColor: #444; backgroundColor: #D3D3D3">

  <a-assets timeout="30000">
    <a-asset-item id="characterModel"  src="moj_karakter.glb"></a-asset-item>
    <a-asset-item id="characterModel2" src="moj_karakter_2.glb"></a-asset-item>
    <a-asset-item id="characterModel3" src="moj_karakter_3.glb"></a-asset-item>
    <a-asset-item id="characterModel4" src="dobri.glb"></a-asset-item>
    <a-asset-item id="characterModel5" src="igor_textured.glb"></a-asset-item>
    <a-asset-item id="pavilionModel"   src="pavilion.glb"></a-asset-item>
  </a-assets>

  <!-- Nebo -->
  <a-sky color="#D3D3D3"></a-sky>

  <!-- Osvjetljenje -->
  <a-entity id="hemiLight" light="type: hemisphere; color: #ffffff; groundColor: #8a8a8a; intensity: 1.1"></a-entity>
  <a-entity id="ambLight" light="type: ambient; color: #ffffff; intensity: 0.35"></a-entity>

  <!-- Direkciono svjetlo putuje sa igračem (sjenke) -->
  <a-entity id="sunRig" follow-position="target: #player1">
    <a-entity id="sunTarget" position="0 0 0"></a-entity>
    <a-entity id="sunLight" position="4 9 5"
              light="type: directional; color: #fff6e8; intensity: 1.6; target: #sunTarget;
                     castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048;
                     shadowCameraLeft: -10; shadowCameraRight: 10; shadowCameraTop: 10; shadowCameraBottom: -10;
                     shadowCameraNear: 0.5; shadowCameraFar: 30; shadowBias: -0.0005"></a-entity>
  </a-entity>

  <!-- Paviljon iz Cinema 4D (pavilion.glb) + plato oko njega -->
  <a-entity id="pavilion" gltf-model="#pavilionModel" pavilion></a-entity>

  <!-- Okruženje 2: glitch šuma (formira se oko svih karaktera) -->
  <a-entity id="forest" glitch-forest="targets: .player"></a-entity>

  <!-- Okruženje 3: zvjezdana dolina sa vijugavim putem -->
  <a-entity id="valley" starry-valley></a-entity>

  <!-- Lobi (okruženje 0 – prikazuje se pri otvaranju sajta): okrugla soba Ø 6.4 m, visina 8 m, logo se okreće iznad stola -->
  <a-entity id="lobby" lobby="logo: deyan_logo.glb"></a-entity>

  <!-- Okruženje 4: beskonačna megastruktura (Escher) sa pokretnim visećim tornjevima -->
  <a-entity id="mega" megastructure></a-entity>

  <!-- Upravljač: WASD/Shift/Space važe za aktivnog karaktera, F prebacuje kontrolu -->
  <a-entity id="controller"
            player-controller="players: .player; cameraRig: #cameraRig; sun: #sunRig; world: #pavilion; walkSpeed: 1.6; runSpeed: 3.9"></a-entity>

  <!-- Karakter 1: root (.player) se kreće, child model (.character) se rotira i animira -->
  <a-entity id="player1" class="player" position="0 0 8">
    <a-entity class="character"
              gltf-model="#characterModel"
              rotation="0 180 0"
              scale="1.8 1.8 1.8"
              shadow="cast: true; receive: false"
              character-animator="idle: idle; walk: walk; run: happy run; kick: drop kick; crossFade: 0.25;
                                  split: idle:0-60, walk:61-92, run:93-112, kick:113-200">
    </a-entity>
  </a-entity>

  <!-- Karakter 2 (F za promjenu) -->
  <a-entity id="player2" class="player" position="1.3 0 8.5">
    <a-entity class="character"
              gltf-model="#characterModel2"
              rotation="0 180 0"
              scale="1.8 1.8 1.8"
              shadow="cast: true; receive: false"
              character-animator="idle: idle; walk: walk; run: happy run; kick: drop kick; crossFade: 0.25;
                                  split: idle:0-499, walk:500-529, run:530-546, kick:547-627">
    </a-entity>
  </a-entity>

  <!-- Karakter 3 -->
  <a-entity id="player3" class="player" position="-1.3 0 8.5">
    <a-entity class="character"
              gltf-model="#characterModel3"
              rotation="0 180 0"
              scale="1.8 1.8 1.8"
              shadow="cast: true; receive: false"
              character-animator="idle: idle; walk: walk; run: happy run; kick: drop kick; crossFade: 0.25;
                                  split: idle:0-100, walk:101-135, run:136-154, kick:155-240">
    </a-entity>
  </a-entity>

  <!-- Karakter 4: Dobri – dobri.glb (teksture su ugrađene; svaka animacija na svom rigu -> 'rigs') -->
  <a-entity id="player4" class="player" position="0 0 9.6">
    <a-entity class="character"
              gltf-model="#characterModel4"
              rotation="0 0 0" data-facing="180"
              hand-sword
              scale="1.8 1.8 1.8"
              shadow="cast: true; receive: false"
              character-animator="idle: idle; walk: walk; run: run; kick: kick; crossFade: 0.25;
                                  rigs: idle:0, walk:1, run:2, kick:3">
    </a-entity>
  </a-entity>

  <!-- Karakter 5: Igor – igor_textured.glb (teksture ugrađene). Jedan klip sa svim animacijama u nizu -> 'split'. -->
  <a-entity id="player5" class="player" position="-1.4 0 10.1">
    <a-entity class="character"
              gltf-model="#characterModel5"
              rotation="0 0 0" data-facing="180"
              scale="2.06 2.06 2.06"
              shadow="cast: true; receive: false"
              character-animator="idle: idle; walk: walk; run: run; kick: kick; crossFade: 0.25;
                                  split: idle:0-300, walk:301-338, run:339-372, kick:373-410">
    </a-entity>
  </a-entity>

  <!-- Camera Rig -->
  <a-entity id="cameraRig" third-person-camera="target: #player1; distance: 4.5; height: 2.3; lookHeight: 1.4; minDist: 2; maxDist: 12; obstacles: #pavilion">
    <a-entity camera="fov: 60; near: 0.1; far: 6000" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
  </a-entity>

</a-scene>
</body>
