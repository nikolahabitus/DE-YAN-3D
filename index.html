  <style>

    }
    #hud b { color: #ffd479; }
    #env-toast {
      position: fixed; top: 22px; left: 50%; transform: translate(-50%, -8px); z-index: 20;
      padding: 9px 18px; border-radius: 999px; background: rgba(20, 20, 30, .7); color: #fff;
      font: 600 14px system-ui, sans-serif; letter-spacing: .04em; opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }
    #env-toast.show { opacity: 1; transform: translate(-50%, 0); }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; z-index: 15;
      border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35);

<div id="crosshair"></div>
<div id="version" style="position:fixed;right:12px;top:10px;z-index:10;font:11px system-ui,sans-serif;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px;pointer-events:none">v22 · GitHub-ready</div>
<div id="hud">
  <b>W A S D</b> hod &nbsp;·&nbsp; <b>Shift</b> + smjer trčanje &nbsp;·&nbsp; <b>Space</b> drop kick<br />

  <b>Nišan + klik na naočare</b> detalji modela &nbsp;·&nbsp; <b>0</b> lobi &nbsp;·&nbsp; <b>1 / 2 / 3 / 4</b> okruženje &nbsp;·&nbsp; <b>Q</b> gustina trave (okruženje 3)

<script>
/* =====================================================================
   POMOĆNE FUNKCIJE
   ===================================================================== */
/** Najkraća razlika dva ugla (radijani), rezultat u [-PI, PI]. */
function angleDelta(from, to) {
  let d = (to - from) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/** Faktor za frame-rate nezavisno glatko približavanje (eksponencijalni lerp). */
function damp(lambda, dt) { return 1 - Math.exp(-lambda * dt); }

function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* =====================================================================
   1) PAVILION
   Loads the pavilion exported from Cinema 4D (pavilion.glb, real-world meters).
   The export has no materials, so materials are assigned by object name
   (BLUE WOOD, Mirror, WATER, LIGHTBOX, ...) with procedural textures.
   Collisions: on load, the real geometry is rasterised into a top-down grid
   (what blocks the body, what blocks the camera, and the floor height).
   API: groundHeight(x, z), resolveMove(from, to, r), cameraHit(head, cam).
   ===================================================================== */
const DEG = Math.PI / 180;

/* ---------- small procedural texture helpers (canvas) ---------- */
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/** Tileable value noise with integer lattice period. */
function periodicNoise(period, seed) {
  const rnd = mulberry32(seed), g = new Float32Array(period * period);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const w = i => ((i % period) + period) % period;
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const i0 = w(xi), i1 = w(xi + 1), j0 = w(yi), j1 = w(yi + 1);
    const a = g[j0 * period + i0], b = g[j0 * period + i1], c = g[j1 * period + i0], d = g[j1 * period + i1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbmFactory(basePeriod, octaves, seed) {
  const n = []; for (let o = 0; o < octaves; o++) n.push(periodicNoise(basePeriod << o, seed + o * 17));
  return (u, v) => { let s = 0, amp = 0.5, norm = 0;
    for (let o = 0; o < octaves; o++) { const p = basePeriod << o; s += n[o](u * p, v * p) * amp; norm += amp; amp *= 0.5; }
    return s / norm; };
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function canvasTex(size, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
/** Figured wood grain (tileable). Lines run mostly vertically with flame-like warps. */
function woodTexture(size, base, line, seed, stripes = 7, warp = 2.6) {
  return canvasTex(size, (ctx, S) => {
    const img = ctx.createImageData(S, S), B = hexRGB(base), L = hexRGB(line);
    const f = fbmFactory(2, 4, seed), fine = periodicNoise(64, seed + 99);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const u = x / S, v = y / S;
      const t = u * stripes + f(u, v) * warp * 2 + f(v, u) * 0.6;
      const d = Math.abs((t - Math.floor(t)) - 0.5);               // 0 at grain line
      let l = Math.exp(-(d * d) / (2 * 0.07 * 0.07)) * 0.8;
      l += (fine(u * 64, v * 8) - 0.5) * 0.12;                      // fibres
      l = Math.min(1, Math.max(0, l));
      const i = (y * S + x) * 4;
      img.data[i] = B[0] + (L[0] - B[0]) * l; img.data[i + 1] = B[1] + (L[1] - B[1]) * l;
      img.data[i + 2] = B[2] + (L[2] - B[2]) * l; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  });
}
function speckle(ctx, S, count, colors, rMin, rMax, seed) {
  const r = mulberry32(seed);
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = colors[Math.floor(r() * colors.length)];
    ctx.beginPath(); ctx.ellipse(r() * S, r() * S, rMin + r() * (rMax - rMin), rMin + r() * (rMax - rMin), r() * 3, 0, 7); ctx.fill();
  }
}
const TERRAZZO_CHIPS = ['#cbbfae', '#b5a998', '#d9d0c3', '#9c8f80', '#e2dbd0', '#a8705a', '#c49b78'];
function terrazzoTexture(size = 512, seed = 3) {
  return canvasTex(size, (ctx, S) => {
    ctx.fillStyle = '#efece6'; ctx.fillRect(0, 0, S, S);
    speckle(ctx, S, S * 3, TERRAZZO_CHIPS, 0.6, 2.2, seed);
  });
}
/** Round platform floor: terrazzo + radial joints, mapped onto a CircleGeometry. */
function pavFloorTexture() {
  return canvasTex(1024, (ctx, S) => {
    ctx.fillStyle = '#f1eee8'; ctx.fillRect(0, 0, S, S);
    speckle(ctx, S, 9000, TERRAZZO_CHIPS, 0.5, 1.6, 11);
    const c = S / 2; ctx.strokeStyle = 'rgba(190,170,135,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(c, c, c * 0.44, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(c, c, c * 0.72, 0, 7); ctx.stroke();
    for (let a = 0; a < 360; a += 15) {
      const ca = Math.cos(a * DEG), sa = Math.sin(a * DEG);
      ctx.beginPath(); ctx.moveTo(c + ca * c * 0.44, c + sa * c * 0.44); ctx.lineTo(c + ca * c, c + sa * c); ctx.stroke();
    }
  }, false);
}
function concreteTexture() {
  return canvasTex(512, (ctx, S) => {
    const img = ctx.createImageData(S, S), f = fbmFactory(4, 5, 21);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const n = f(x / S, y / S), i = (y * S + x) * 4, g = 168 + (n - 0.5) * 40 + (Math.random() - 0.5) * 10;
      img.data[i] = g; img.data[i + 1] = g + 2; img.data[i + 2] = g + 5; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.strokeStyle = 'rgba(70,70,70,0.55)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, S - 2, S - 2); // tile joint
  });
}
/** Pastel gradient for the light disc (teal → cream/yellow → pink). */
function gradientDiscTexture() {
  return canvasTex(512, (ctx, S) => {
    ctx.fillStyle = '#f3e9c2'; ctx.fillRect(0, 0, S, S);
    const blob = (x, y, r, col) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, col); g.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    };
    blob(S * 0.18, S * 0.22, S * 0.7, 'rgba(140,228,214,1)');
    blob(S * 0.45, S * 0.9, S * 0.55, 'rgba(250,224,150,0.95)');
    blob(S * 0.88, S * 0.62, S * 0.5, 'rgba(244,120,220,1)');
    blob(S * 0.55, S * 0.4, S * 0.35, 'rgba(250,246,236,0.8)');
  }, false);
}
function shieldLensTexture() {
  return canvasTex(256, (ctx, S) => {
    const g = ctx.createLinearGradient(0, 0, S, 0);
    g.addColorStop(0, '#5a1e8c'); g.addColorStop(0.45, '#d8325a'); g.addColorStop(0.8, '#f29a2e'); g.addColorStop(1, '#3a7bd5');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  }, false);
}

/* ---------- generic eyewear (no branding) ---------- */
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function makeGlassesFactory(mats) {
  const W = 0.052, H = 0.04, GAP = 0.016, D = 0.005, T = 0.0045;
  const ringShape = (w, h, r) => { const s = roundedRect(w, h, r); s.holes.push(roundedRect(w - 2 * T, h - 2 * T, Math.max(0.002, r - T))); return s; };
  const geo = {
    frameSq: new THREE.ExtrudeGeometry(ringShape(W, H, 0.01), { depth: D, bevelEnabled: false }),
    lensSq:  new THREE.ShapeGeometry(roundedRect(W - 2 * T, H - 2 * T, 0.006)),
    frameRd: new THREE.ExtrudeGeometry(ringShape(W * 0.95, H * 1.05, 0.019), { depth: D, bevelEnabled: false }),
    lensRd:  new THREE.ShapeGeometry(roundedRect(W * 0.95 - 2 * T, H * 1.05 - 2 * T, 0.015)),
    bridge:  new THREE.BoxGeometry(GAP + 0.004, 0.005, D),
    temple:  new THREE.BoxGeometry(0.004, 0.006, 0.13),
    shield:  new THREE.ShapeGeometry(roundedRect(0.14, 0.045, 0.02)),
    topBar:  new THREE.BoxGeometry(0.14, 0.007, 0.008)
  };
  const mesh = (g, m, x, y, z) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; return o; };
  return (variant) => {
    const g = new THREE.Group(), lift = H / 2 + 0.002, cx = W / 2 + GAP / 2;
    if (variant === 'sport') {
      g.add(mesh(geo.shield, mats.shield, 0, lift, D));
      g.add(mesh(geo.topBar, mats.frameWhite, 0, lift + 0.022, D / 2));
      g.add(mesh(geo.temple, mats.frameWhite, -0.068, lift + 0.012, -0.065));
      g.add(mesh(geo.temple, mats.frameWhite, 0.068, lift + 0.012, -0.065));
      return g;
    }
    const round = variant === 'round', lensMat = variant === 'optical' ? mats.lensClear : mats.lensDark;
    for (const s of [-1, 1]) {
      g.add(mesh(round ? geo.frameRd : geo.frameSq, mats.frame, s * cx, lift, 0));
      g.add(mesh(round ? geo.lensRd : geo.lensSq, lensMat, s * cx, lift, D * 0.5));
      g.add(mesh(geo.temple, mats.frame, s * (W + GAP / 2 - 0.002), lift + H * 0.3, -0.065));
    }
    g.add(mesh(geo.bridge, mats.frame, 0, lift + H * 0.22, D / 2));
    return g;
  };
}

/** Reflection map: a tiny blurred "room" (sky, blue walls, floor, pastel glow) baked with PMREM for a given renderer. */
function makeEnvMap(renderer, discTex) {
  const env = new THREE.Scene();
  const sph = new THREE.SphereGeometry(10, 48, 24), col = [], p = sph.attributes.position;
  const sky = new THREE.Color('#f2f4f8'), wall = new THREE.Color('#2536b0'), floor = new THREE.Color('#ece8e0'), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 10;
    if (y > 0.45) c.copy(sky); else if (y > -0.15) c.copy(wall).lerp(sky, Math.max(0, (y - 0.3) / 0.15)); else c.copy(floor);
    col.push(c.r, c.g, c.b);
  }
  sph.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  env.add(new THREE.Mesh(sph, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const glow = new THREE.Mesh(new THREE.CircleGeometry(3, 32), new THREE.MeshBasicMaterial({ map: discTex, side: THREE.DoubleSide }));
  glow.rotation.x = Math.PI / 2; glow.position.y = 6; env.add(glow);
  const pm = new THREE.PMREMGenerator(renderer);
  const map = pm.fromScene(env, 0.02).texture; pm.dispose();
  return map;
}

AFRAME.registerComponent('pavilion', {
  schema: {
    cell:    { type: 'number', default: 0.05 },   // collision grid resolution (m)
    glasses: { type: 'boolean', default: true }   // put generic glasses on the trays
  },

  init() {
    this.ready = false;
    this.envTargets = [];
    this.extra = new THREE.Group();
    this.el.setObject3D('extra', this.extra);

    this.tex = {
      blueWood:  woodTexture(1024, '#1c2896', '#7084dc', 7, 16, 3.4),
      lightWood: woodTexture(1024, '#dcc89e', '#a98c5e', 13, 14, 3.0),
      terrazzo:  terrazzoTexture(),
      concrete:  concreteTexture(),
      disc:      gradientDiscTexture(),
      shield:    shieldLensTexture()
    };
    const std = (o) => new THREE.MeshStandardMaterial(o);
    this.mat = {
      blueWood:  std({ map: this.tex.blueWood, roughness: 0.7 }),
      lightWood: std({ map: this.tex.lightWood, roughness: 0.7 }),
      terrazzo:  std({ map: this.tex.terrazzo, roughness: 0.75 }),
      plinth:    std({ color: '#e3d6c0', roughness: 0.85 }),
      chrome:    std({ color: '#ffffff', metalness: 1, roughness: 0.06 }),
      mirror:    std({ color: '#d4dcef', metalness: 1, roughness: 0.02 }),
      ceiling:   std({ color: '#8d97c4', metalness: 0.9, roughness: 0.2, envMapIntensity: 0.8 }),
      water:     std({ color: '#070b1e', metalness: 0.6, roughness: 0.05 }),
      metal:     std({ color: '#d9dbde', metalness: 0.6, roughness: 0.35 }),
      fixture:   std({ color: '#111111', roughness: 0.5 }),
      bulb:      new THREE.MeshBasicMaterial({ color: '#fff4dc' }),
      led:       new THREE.MeshBasicMaterial({ color: '#dfe9ff' }),
      disc:      new THREE.MeshBasicMaterial({ map: this.tex.disc, side: THREE.DoubleSide, toneMapped: false }),
      white:     std({ color: '#f4f2ee', roughness: 0.6 })
    };
    this.envTargets.push(this.mat.chrome, this.mat.mirror, this.mat.ceiling, this.mat.water, this.mat.metal);

    // plaza around the pavilion
    const t = this.tex.concrete; t.repeat.set(40, 40);
    const g = new THREE.PlaneGeometry(80, 80); g.rotateX(-Math.PI / 2);
    const ground = new THREE.Mesh(g, std({ map: t, roughness: 0.95 })); ground.position.y = -0.002; ground.receiveShadow = true;
    this.extra.add(ground);

    this.el.addEventListener('model-loaded', e => this.onModel(e.detail.model));
  },

  onModel(model) {
    // centre the C4D model on the origin (XZ) with its base at y = 0
    const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3());
    model.position.x -= c.x; model.position.z -= c.z; model.position.y -= box.min.y;
    model.updateMatrixWorld(true);
    this.model = model;

    const trays = [];
    model.traverse(o => {
      if (!o.isMesh) return;
      const path = this.pathOf(o), leaf = path.split('/').pop();
      const [mat, mapping, flags = {}] = this.pick(path, leaf);
      if (mapping) this.project(o, mapping);
      o.material = mat;
      o.castShadow = !flags.noCast; o.receiveShadow = true;
      if (flags.tray) trays.push({ mesh: o, rim: flags.tray === 'rim' });
    });

    this.buildGrids(model);
    if (this.data.glasses) this.placeGlasses(trays);
    this.ready = true;
    this.el.emit('pavilion-ready');
  },

  /** Normalised hierarchy path, e.g. "/SHOWROOM/CENTRALSCULPTURE/POOLSKUS/TRAYS/CYLINDER9". */
  pathOf(o) {
    const parts = [];
    for (let p = o; p && p !== this.model.parent; p = p.parent) parts.unshift((p.name || '').toUpperCase().replace(/[\s_.\-]/g, ''));
    return parts.join('/');
  },

  /** Material + texture projection by object name (the C4D export carries no materials). */
  pick(P, L) {
    const m = this.mat, has = s => P.includes(s);
    if (L.includes('BLUEWOOD'))                      return [m.blueWood, 'cyl'];
    if (L.includes('MIRROR') || has('MIRROS'))       return [m.mirror];
    if (L.includes('LOGOLED') || has('/LED'))        return [m.led, null, { noCast: true }];
    if (has('WATER'))                                return [m.water, null, { noCast: true }];
    if (has('LIGHTBOX'))                             return L.startsWith('EXTRUDE') ? [m.disc, 'disc', { noCast: true }] : [m.white, null, { noCast: true }];
    if (has('/LIGHTS/'))                             return L.startsWith('LIGHT') ? [m.bulb, null, { noCast: true }] : [m.fixture, null, { noCast: true }];
    if (has('POOLSKUS'))                             return has('TRAYS') ? [m.terrazzo, 'box', { tray: 'pool' }] : [m.chrome];
    if (has('TRIMSKUS'))                             return L.startsWith('CYLINDER') ? [m.plinth, null, { tray: 'rim' }] : [m.terrazzo, 'box'];
    if (has('CENTRALSCULPTURE'))                     return [m.terrazzo, 'cyl'];
    if (has('VIRTUALTRYON'))                         return L === 'TUBE3' ? [m.lightWood, 'cyl'] : [m.blueWood, 'cyl'];
    if (has('FACADE'))                               return L.startsWith('OBJECT') ? [m.metal] : [m.blueWood, 'cyl'];
    if (has('CEILING'))                              return has('OP1') ? [m.ceiling, null, { noCast: true }] : [m.lightWood, 'cyl', { noCast: true }];
    if (has('/BASE/'))                               return has('OP2') ? [m.terrazzo, 'planar'] : [m.lightWood, 'cyl'];
    return [m.white];
  },

  /** World-space UVs: 'cyl' (curved walls/fins), 'planar' (floors), 'box', 'disc' (fit to bbox). 1 tile ≈ 1 m. */
  project(mesh, mode) {
    const geo = mesh.geometry = mesh.geometry.clone();           // instances may share geometry
    const pos = geo.attributes.position, nor = geo.attributes.normal, n = pos.count;
    const uv = new Float32Array(n * 2), M = mesh.matrixWorld, N = new THREE.Matrix3().getNormalMatrix(M);
    const p = new THREE.Vector3(), q = new THREE.Vector3();
    let bb = null;
    if (mode === 'disc') { geo.computeBoundingBox(); bb = geo.boundingBox.clone().applyMatrix4(M); }
    for (let i = 0; i < n; i++) {
      p.fromBufferAttribute(pos, i).applyMatrix4(M);
      q.set(0, 1, 0); if (nor) q.fromBufferAttribute(nor, i).applyMatrix3(N).normalize();
      let u, v;
      if (mode === 'disc') { u = (p.x - bb.min.x) / (bb.max.x - bb.min.x); v = (p.z - bb.min.z) / (bb.max.z - bb.min.z); }
      else if (mode === 'planar' || Math.abs(q.y) > 0.75) { u = p.x; v = p.z; }
      else if (mode === 'box') { if (Math.abs(q.x) > Math.abs(q.z)) { u = p.z; v = p.y; } else { u = p.x; v = p.y; } }
      else { // cylindrical around the pavilion centre
        const r = Math.hypot(p.x, p.z) || 1e-6, radial = Math.abs((q.x * p.x + q.z * p.z) / r);
        u = radial > 0.6 ? Math.atan2(p.z, p.x) * r : r;           // walls: arc length, fins: radius
        v = p.y;
      }
      uv[i * 2] = u; uv[i * 2 + 1] = v;
    }
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  },

  /* ---------- collision / walkability grids built from the real geometry ---------- */
  buildGrids(model) {
    const box = new THREE.Box3().setFromObject(model), cell = this.data.cell, pad = 0.5;
    this.gx0 = box.min.x - pad; this.gz0 = box.min.z - pad;
    this.nx = Math.ceil((box.max.x - box.min.x + 2 * pad) / cell); this.nz = Math.ceil((box.max.z - box.min.z + 2 * pad) / cell);
    const N = this.nx * this.nz;
    this.occ  = new Uint8Array(N);          // blocks characters (body height 0.45–1.8 m)
    this.tall = new Uint8Array(N);          // blocks the camera (1.9–3.2 m: walls, fins, mirrors)
    this.hm   = new Float32Array(N).fill(-1); // walkable floor height

    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    model.traverse(o => {
      if (!o.isMesh) return;
      const camBlocks = !this.pathOf(o).includes('FACADE');   // thin front fins don't push the camera in
      const pos = o.geometry.attributes.position, idx = o.geometry.index, M = o.matrixWorld;
      const triCount = idx ? idx.count / 3 : pos.count / 3;
      for (let t = 0; t < triCount; t++) {
        const i0 = idx ? idx.getX(t * 3) : t * 3, i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1, i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
        a.fromBufferAttribute(pos, i0).applyMatrix4(M); b.fromBufferAttribute(pos, i1).applyMatrix4(M); c.fromBufferAttribute(pos, i2).applyMatrix4(M);
        const ymin = Math.min(a.y, b.y, c.y), ymax = Math.max(a.y, b.y, c.y);
        if (ymax > 0.45 && ymin < 1.8) this.rasterTri(a, b, c, k => { this.occ[k] = 1; });
        if (camBlocks && ymax > 1.9 && ymin < 3.2) this.rasterTri(a, b, c, k => { this.tall[k] = 1; });
        if (ymax <= 0.35) this.rasterTri(a, b, c, k => { if (ymax > this.hm[k]) this.hm[k] = ymax; });
      }
    });
  },

  /** Fill a triangle's XZ footprint (area + edges, so vertical walls count too). */
  rasterTri(a, b, c, fn) {
    const cell = this.data.cell, nx = this.nx, nz = this.nz, x0 = this.gx0, z0 = this.gz0;
    const ix = x => Math.floor((x - x0) / cell), iz = z => Math.floor((z - z0) / cell);
    const mark = (i, j) => { if (i >= 0 && j >= 0 && i < nx && j < nz) fn(j * nx + i); };
    // edges
    for (const [p, q] of [[a, b], [b, c], [c, a]]) {
      const steps = Math.max(1, Math.ceil(Math.hypot(q.x - p.x, q.z - p.z) / (cell * 0.5)));
      for (let s = 0; s <= steps; s++) { const f = s / steps; mark(ix(p.x + (q.x - p.x) * f), iz(p.z + (q.z - p.z) * f)); }
    }
    // interior
    const area = (b.x - a.x) * (c.z - a.z) - (c.x - a.x) * (b.z - a.z);
    if (Math.abs(area) < 1e-9) return;
    const i0 = ix(Math.min(a.x, b.x, c.x)), i1 = ix(Math.max(a.x, b.x, c.x));
    const j0 = iz(Math.min(a.z, b.z, c.z)), j1 = iz(Math.max(a.z, b.z, c.z));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const px = x0 + (i + 0.5) * cell, pz = z0 + (j + 0.5) * cell;
      const w0 = ((b.x - px) * (c.z - pz) - (c.x - px) * (b.z - pz)) / area;
      const w1 = ((c.x - px) * (a.z - pz) - (a.x - px) * (c.z - pz)) / area;
      if (w0 >= 0 && w1 >= 0 && w0 + w1 <= 1) mark(i, j);
    }
  },

  cellIndex(x, z) {
    const i = Math.floor((x - this.gx0) / this.data.cell), j = Math.floor((z - this.gz0) / this.data.cell);
    return (i < 0 || j < 0 || i >= this.nx || j >= this.nz) ? -1 : j * this.nx + i;
  },

  isFree(x, z, r) {
    if (!this.ready) return true;
    const cell = this.data.cell, n = Math.ceil(r / cell);
    const ci = Math.floor((x - this.gx0) / cell), cj = Math.floor((z - this.gz0) / cell);
    for (let j = cj - n; j <= cj + n; j++) for (let i = ci - n; i <= ci + n; i++) {
      if (i < 0 || j < 0 || i >= this.nx || j >= this.nz) continue;
      const px = this.gx0 + (i + 0.5) * cell - x, pz = this.gz0 + (j + 0.5) * cell - z;
      if (px * px + pz * pz <= r * r && this.occ[j * this.nx + i]) return false;
    }
    return true;
  },

  /* ---------- API used by player-controller / third-person-camera ---------- */

  groundHeight(x, z) {
    if (!this.ready) return 0;
    const k = this.cellIndex(x, z);
    return k < 0 ? 0 : Math.max(0, this.hm[k]);
  },

  /** Move from `from` to `to` (Vector3, x/z) without entering geometry; slides along walls. Mutates `to`. */
  resolveMove(from, to, r) {
    if (!this.ready || this.isFree(to.x, to.z, r)) return;
    if (!this.isFree(from.x, from.z, r)) return;               // already overlapping – let it walk out
    if (this.isFree(to.x, from.z, r)) { to.z = from.z; return; }
    if (this.isFree(from.x, to.z, r)) { to.x = from.x; return; }
    to.x = from.x; to.z = from.z;
  },

  /** Fraction (0–1) along head→camera where a wall is hit, or null. */
  cameraHit(head, cam) {
    if (!this.ready) return null;
    const dx = cam.x - head.x, dz = cam.z - head.z, len = Math.hypot(dx, dz);
    const steps = Math.ceil(len / (this.data.cell * 0.5));
    for (let s = 1; s <= steps; s++) {
      const f = s / steps, k = this.cellIndex(head.x + dx * f, head.z + dz * f);
      if (k >= 0 && this.tall[k]) return f;
    }
    return null;
  },

  placeGlasses(trays) {
    const rnd = mulberry32(42), make = this.makeGlasses = makeGlassesFactory({
      frame:      new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.35 }),
      frameWhite: new THREE.MeshStandardMaterial({ color: '#f0f0f0', roughness: 0.3 }),
      lensDark:   new THREE.MeshStandardMaterial({ color: '#0b0d12', metalness: 0.3, roughness: 0.05, transparent: true, opacity: 0.9, side: THREE.DoubleSide }),
      lensClear:  new THREE.MeshStandardMaterial({ color: '#dce8f0', metalness: 0.1, roughness: 0.05, transparent: true, opacity: 0.18, side: THREE.DoubleSide }),
      shield:     new THREE.MeshStandardMaterial({ map: this.tex.shield, metalness: 0.6, roughness: 0.12, side: THREE.DoubleSide })
    });
    const variants = ['sun', 'optical', 'round', 'sport', 'sun', 'optical'], bb = new THREE.Box3(), cc = new THREE.Vector3();
    // invisible, slightly oversized box per pair = easy click target
    const hitGeo = new THREE.BoxGeometry(0.2, 0.09, 0.2), hitMat = new THREE.MeshBasicMaterial({ visible: false });
    this.glassesItems = []; this.hitBoxes = [];
    let nPool = 0, nRim = 0;
    for (const { mesh, rim } of trays) {
      bb.setFromObject(mesh); bb.getCenter(cc);
      const variant = variants[Math.floor(rnd() * variants.length)];
      const g = make(variant);
      g.position.set(cc.x, bb.max.y + 0.001, cc.z);
      g.rotation.y = rim ? Math.atan2(cc.x, cc.z) + (rnd() - 0.5) * 0.4 : rnd() * Math.PI * 2; // rim: face visitors
      const hit = new THREE.Mesh(hitGeo, hitMat); hit.position.set(0, 0.03, -0.03); g.add(hit);
      const item = { group: g, variant, display: rim ? `Rim plinth ${String(++nRim).padStart(2, '0')}` : `Pool tray ${String(++nPool).padStart(2, '0')}` };
      hit.userData.glassesItem = item;
      this.glassesItems.push(item); this.hitBoxes.push(hit);
      this.extra.add(g);
    }
  },

  buildEnvironment() {
    const renderer = this.el.sceneEl.renderer; if (!renderer) return;
    const map = makeEnvMap(renderer, this.tex.disc);
    this.envTargets.forEach(m => { m.envMap = map; m.needsUpdate = true; });
  },

  tick() {
    if (!this.envBuilt) { this.envBuilt = true; this.buildEnvironment(); }
  }
});


/* =====================================================================
   2) CHARACTER-ANIMATOR
   Mapira logička stanja (idle/walk/run/kick) na stvarna imena klipova
   u GLB-u i upravlja aframe-extras `animation-mixer` komponentom
   uz crossfade između stanja.
   ===================================================================== */
AFRAME.registerComponent('character-animator', {
  schema: {
    idle:      { default: 'idle' },
    walk:      { default: 'walk' },
    run:       { default: 'happy run' },
    kick:      { default: 'drop kick' },
    crossFade: { type: 'number', default: 0.25 }, // sekunde
    // Ako GLB ima samo JEDAN klip u kome su animacije poređane jedna za drugom,
    // ovdje se definišu opsezi frejmova (uključivo) za svako stanje.
    split:     { default: '' },  // npr. 'idle:0-60, walk:61-92, run:93-112, kick:113-200'
    fps:       { type: 'number', default: 30 },
    // Ukloni root-motion (X/Z pomak kukova) – kretanje radi kod, ne animacija
    inPlace:   { type: 'boolean', default: true },
    // Model sa više skeleta (npr. Cinema 4D: svaka animacija na svom rigu, samo jedan je skinovan).
    // 'idle:0, walk:1, run:2, kick:3' = indeks root skeleta (redoslijed u sceni) za svako stanje.
    rigs:      { default: '' }
  },

  init() {
    this.ready = false;
    this.state = null;
    this.pending = 'idle';
    this.clips = {};      // state -> THREE.AnimationClip

    this.el.addEventListener('model-loaded', e => this.onModel(e.detail.model));

    // aframe-extras emituje 'animation-finished' za LoopOnce klipove
    this.el.addEventListener('animation-finished', e => {
      if (this.state === 'kick' && e.detail.action.getClip() === this.clips.kick) {
        this.el.emit('kick-finished');
      }
    });
  },

  onModel(model) {
    this.model = model;
    const all = model.animations || [];
    if (!all.length) { console.warn('[animator] Model nema animacija.'); return; }

    if (this.data.rigs.trim()) this.retargetRigs(model, all);

    // Jedan klip sa više animacija u nizu -> isjeci ga na pod-klipove
    else if (all.length === 1 && this.data.split.trim()) {
      const source = all[0];
      this.data.split.split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(part => {
        const m = part.match(/^(\w+)\s*:\s*(\d+)\s*-\s*(\d+)$/);
        if (!m || !(m[1] in this.data)) return console.warn(`[animator] Neispravan split: "${part}"`);
        const [, state, from, to] = m;
        // ±0.5 frejma da zaokruživanje float vremena ne "pojede" granični frejm
        const sub = THREE.AnimationUtils.subclip(source, this.data[state], +from - 0.5, +to + 0.5, this.data.fps);
        all.push(sub);
      });
    }

    const norm = s => s.toLowerCase().replace(/[\s_\-]+/g, '');
    const find = wanted => {
      const w = norm(wanted);
      return all.find(c => norm(c.name) === w)       // tačno ime
          || all.find(c => norm(c.name).includes(w)) // npr. "Armature|happy run"
          || null;
    };

    ['idle', 'walk', 'run', 'kick'].forEach(state => {
      const clip = find(this.data[state]);
      if (!clip) console.warn(`[animator] Klip "${this.data[state]}" nije pronađen – koristim "${all[0].name}". ` +
                              `Dostupni klipovi: ${all.map(c => `"${c.name}"`).join(', ')}`);
      this.clips[state] = clip || all[0];
    });

    if (this.data.inPlace) new Set(Object.values(this.clips)).forEach(c => this.removeRootMotion(c));

    this.ready = true;
    const s = this.pending || 'idle';
    this.state = null;
    this.setState(s);
  },

  /** Više skeleta u jednom fajlu: tragove svakog riga prebaci na kosti skinovanog skeleta,
      skrati klip na dio gdje se rig zaista kreće i ukloni nekorišćene skelete iz scene. */
  retargetRigs(model, all) {
    const source = all[0], base = n => n.replace(/_\d+$/, '');
    const roots = model.children.filter(o => !o.isMesh);   // čvorovi skeleta (mesh je zaseban čvor)
    let skinned = null; model.traverse(o => { if (o.isSkinnedMesh && !skinned) skinned = o; });
    if (!skinned || roots.length < 2) return console.warn('[animator] rigs: nema više skeleta.');
    const skinRoot = roots.find(r => skinned.skeleton.bones.some(b => { let o = b; while (o.parent && o.parent !== model) o = o.parent; return o === r; }));
    const target = {};                                   // osnovno ime kosti -> ime kosti skinovanog skeleta
    skinRoot.traverse(o => { if (o.isBone) target[base(o.name)] = o.name; });
    const owner = {};                                    // ime čvora -> indeks root skeleta
    roots.forEach((r, i) => r.traverse(o => { owner[o.name] = i; }));
    const dt = 1 / this.data.fps;
    this.data.rigs.split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(part => {
      const m = part.match(/^(\w+)\s*:\s*(\d+)$/);
      if (!m || !(m[1] in this.data)) return console.warn(`[animator] Neispravan rigs: "${part}"`);
      const ri = +m[2], tracks = [];
      let end = dt;
      source.tracks.forEach(t => {
        const dot = t.name.lastIndexOf('.'), node = t.name.slice(0, dot), prop = t.name.slice(dot);
        if (owner[node] !== ri || !target[base(node)]) return;
        const tr = t.clone(); tr.name = target[base(node)] + prop;
        // posljednji ključ koji se razlikuje od završne poze = kraj animacije ovog riga
        const v = tr.values, w = v.length / tr.times.length, last = v.length - w;
        for (let k = tr.times.length - 1; k > 0; k--) {
          let diff = 0; for (let j = 0; j < w; j++) diff = Math.max(diff, Math.abs(v[k * w + j] - v[last + j]));
          if (diff > 1e-4) { end = Math.max(end, tr.times[k + 1] ?? tr.times[k]); break; }
        }
        tracks.push(tr);
      });
      tracks.forEach(tr => tr.trim(0, end));
      all.push(new THREE.AnimationClip(this.data[m[1]], end, tracks));
    });
    roots.forEach(r => { if (r !== skinRoot) model.remove(r); });   // ostali rigovi samo nose animaciju
  },

  /** Zaključa X/Z poziciju root kosti (Hips) na vrijednost prvog frejma; Y (poskakivanje) ostaje. */
  removeRootMotion(clip) {
    const track = clip.tracks.find(t => /hips(_\d+)?\.position$/i.test(t.name));
    if (!track) return;
    const v = track.values, x0 = v[0], z0 = v[2];
    for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
  },

  /** Trajanje klipa za stanje (sekunde). */
  duration(state) { return this.clips[state] ? this.clips[state].duration : 1; },

  setState(state) {
    if (!this.ready) { this.pending = state; return; }
    if (state === this.state) return;
    this.state = state;

    const clip = this.clips[state];
    const once = state === 'kick';

    // Klip koji se pušta jednom mora krenuti od početka (reset vremena akcije)
    if (once) {
      const mixerComp = this.el.components['animation-mixer'];
      if (mixerComp && mixerComp.mixer) mixerComp.mixer.clipAction(clip, this.model).reset();
    }

    this.el.setAttribute('animation-mixer', {
      clip: `^${escapeRegExp(clip.name)}$`,
      useRegExp: true,
      loop: once ? 'once' : 'repeat',
      repetitions: once ? 1 : Infinity,
      clampWhenFinished: once,           // drži zadnju pozu dok traje fade nazad u idle
      crossFadeDuration: this.data.crossFade
    });
  }
});

/* =====================================================================
   3) THIRD-PERSON-CAMERA
   Rig prati igrača sa leđa i blago odozgo. Miš (drag) okreće kameru
   oko igrača, točkić mijenja udaljenost.
   ===================================================================== */
AFRAME.registerComponent('third-person-camera', {
  schema: {
    target:     { type: 'selector' },
    distance:   { type: 'number', default: 3.6 },
    height:     { type: 'number', default: 1.9 },
    lookHeight: { type: 'number', default: 0.8 },  // tačka na karakteru u koju gledamo
    follow:     { type: 'number', default: 8 },    // brzina praćenja
    minDist:    { type: 'number', default: 2 },
    maxDist:    { type: 'number', default: 10 },
    obstacles:  { type: 'selector' }   // entitet sa 'pavilion' komponentom (zidovi blokiraju kameru)
  },

  init() {
    this.yaw = 0;                         // 0 = kamera iza karaktera, gleda prema -Z
    this.dist = this.data.distance;
    this.tmp = new THREE.Vector3();
    this.head = new THREE.Vector3();
    this.dir = new THREE.Vector3();
    this.ray = new THREE.Raycaster();
    this.pitch = 0;                       // dodatni nagib mišem (gore/dolje)

    const canvasReady = () => {
      const c = this.el.sceneEl.canvas;
      // Pointer lock: klik na scenu sakrije kursor, pomjeranje miša okreće kameru; Esc oslobađa kursor
      c.addEventListener('click', () => {
        if (document.pointerLockElement !== c && !document.body.classList.contains('modal-open')) c.requestPointerLock();
      });
      document.addEventListener('pointerlockchange', () => document.body.classList.toggle('locked', document.pointerLockElement === c));
      document.addEventListener('mousemove', e => {
        if (document.pointerLockElement !== c) return;
        this.yaw -= e.movementX * 0.0025;
        this.pitch = THREE.MathUtils.clamp(this.pitch + e.movementY * 0.002, -0.55, 0.95);
      });
      c.addEventListener('wheel', e => {
        e.preventDefault();
        this.dist = THREE.MathUtils.clamp(this.dist + e.deltaY * 0.004, this.data.minDist, this.data.maxDist);
      }, { passive: false });
    };
    if (this.el.sceneEl.canvas) canvasReady();
    else this.el.sceneEl.addEventListener('render-target-loaded', canvasReady, { once: true });
  },

  tick(time, dtMs) {
    if (!this.data.target) return;
    const dt = Math.min(dtMs / 1000, 0.1);
    const t = this.data.target.object3D.getWorldPosition(this.tmp);
    const o = this.el.object3D;

    // Željena pozicija: orbita oko glave karaktera (yaw + nagib); nagib mišem se dodaje osnovnom
    const rise = this.data.height - this.data.lookHeight;
    const elev = THREE.MathUtils.clamp(Math.atan2(rise, this.dist) + this.pitch, -0.35, 1.3);
    const D = Math.hypot(this.dist, rise);
    let desiredX = t.x + Math.sin(this.yaw) * Math.cos(elev) * D;
    let desiredY = t.y + this.data.lookHeight + Math.sin(elev) * D;
    let desiredZ = t.z + Math.cos(this.yaw) * Math.cos(elev) * D;

    // Ako je zid između karaktera i kamere, privuci kameru ispred zida
    let snap = false;
    const mgr = this.el.sceneEl.components['env-manager'];
    const pav = mgr ? mgr.world() : (this.data.obstacles && this.data.obstacles.components.pavilion);
    if (pav) {
      this.head.set(t.x, t.y + this.data.lookHeight, t.z);
      this.tmp2 = this.tmp2 || new THREE.Vector3();
      const cam = this.tmp2.set(desiredX, desiredY, desiredZ);
      const f = pav.cameraHit(this.head, cam);
      if (f !== null) {
        const len = this.head.distanceTo(cam), d = Math.max(0.35, f * len - 0.3) / len;
        desiredX = this.head.x + (cam.x - this.head.x) * d;
        desiredY = this.head.y + (cam.y - this.head.y) * d;
        desiredZ = this.head.z + (cam.z - this.head.z) * d;
        snap = o.position.distanceTo(this.head) > d * len;   // kamera je iza zida -> odmah je prebaci ispred
      }
    }

    const k = snap ? 1 : damp(this.data.follow, dt);
    o.position.x += (desiredX - o.position.x) * k;
    o.position.y += (desiredY - o.position.y) * k;
    o.position.z += (desiredZ - o.position.z) * k;
    // nikad ispod terena (brda u okruženju 3)
    if (pav && pav.groundHeight) o.position.y = Math.max(o.position.y, pav.groundHeight(o.position.x, o.position.z) + 0.4);

    // Orijentacija: gleda u glavu karaktera
    const hx = t.x - o.position.x, hy = t.y + this.data.lookHeight - o.position.y, hz = t.z - o.position.z;
    o.rotation.set(Math.atan2(hy, Math.hypot(hx, hz)), Math.atan2(-hx, -hz), 0, 'YXZ');
  }
});

/* =====================================================================
   4) PLAYER-CONTROLLER
   WASD = hod, Shift + WASD = trčanje, Space = drop kick (jednom).
   Kretanje je relativno u odnosu na kameru; model se glatko okreće
   u pravcu kretanja.
   ===================================================================== */
AFRAME.registerComponent('player-controller', {
  schema: {
    players:   { type: 'selectorAll' }, // root entiteti karaktera (svaki ima child .character sa GLB modelom)
    cameraRig: { type: 'selector' },
    sun:       { type: 'selector' },    // entitet sa follow-position (svjetlo prati aktivnog)
    walkSpeed: { type: 'number', default: 1.3 },
    runSpeed:  { type: 'number', default: 3.4 },
    accel:     { type: 'number', default: 10 },  // ubrzanje/kočenje
    turnSpeed: { type: 'number', default: 12 },
    radius:    { type: 'number', default: 0.28 }, // "tijelo" karaktera – sudari sa drugima i sa paviljonom
    world:     { type: 'selector' }                // entitet sa 'pavilion' komponentom
  },

  init() {
    this.keys = {};
    this.velocity = new THREE.Vector3();
    this.targetVel = new THREE.Vector3();
    this.kicking = false;
    this.kickTimer = 0;
    this.active = 0;

    this.onKeyDown = e => {
      if (document.body.classList.contains('modal-open')) return;   // popup sa naočarima je otvoren
      if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) e.preventDefault();
      this.keys[e.code] = true;
      if (e.code === 'Space' && !e.repeat) this.startKick();
      if (e.code === 'KeyF' && !e.repeat) this.switchCharacter();
    };
    this.onKeyUp = e => { this.keys[e.code] = false; };
    this.onBlur  = () => { this.keys = {}; };

    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
    window.addEventListener('blur', this.onBlur);

    this.data.players.forEach(pl => pl.addEventListener('kick-finished', e => {
      if (e.target === this.getModel()) this.endKick();
    }));

    // Kamera i svjetlo kreću od prvog karaktera
    this.el.sceneEl.addEventListener('loaded', () => this.focus(this.getPlayer()), { once: true });
  },

  remove() {
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('keyup', this.onKeyUp);
    window.removeEventListener('blur', this.onBlur);
  },

  getPlayer()   { return this.data.players[this.active]; },
  getModel()    { return this.getPlayer().querySelector('.character'); },
  getAnimator() { const m = this.getModel(); return m && m.components['character-animator']; },

  /** Usmjeri kameru i svjetlo na zadatog karaktera (kamera glatko "doleti"). */
  focus(player) {
    if (this.data.cameraRig) this.data.cameraRig.setAttribute('third-person-camera', 'target', player);
    if (this.data.sun) this.data.sun.setAttribute('follow-position', 'target', player);
  },

  /** F: prethodni karakter ostaje gdje jeste (u idle-u), kontrola prelazi na sljedećeg. */
  switchCharacter() {
    const players = this.data.players;
    if (players.length < 2) return;

    // Zaustavi trenutnog karaktera
    const oldA = this.getAnimator();
    if (oldA) oldA.setState('idle');
    this.kicking = false;
    this.velocity.set(0, 0, 0);

    this.active = (this.active + 1) % players.length;
    const newA = this.getAnimator();
    if (newA) newA.setState('idle');

    this.focus(this.getPlayer());
    this.el.emit('character-changed', { index: this.active, el: this.getPlayer() });
  },

  startKick() {
    const an = this.getAnimator();
    if (this.kicking || !an) return;
    this.kicking = true;
    // Sigurnosni tajmer (ako event iz miksera iz bilo kog razloga izostane)
    this.kickTimer = an.duration('kick') + 0.3;
    an.setState('kick');
  },

  endKick() {
    if (!this.kicking) return;
    this.kicking = false;
    this.getAnimator().setState('idle'); // tick će odmah prebaciti u walk/run ako se drži taster
  },

  tick(time, dtMs) {
    const dt = Math.min(dtMs / 1000, 0.1);
    const k = this.keys;
    const animator = this.getAnimator();
    if (!animator) return;

    // Ulaz: x = desno/lijevo, z = naprijed/nazad
    const ix = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0);
    const iz = (k.KeyW ? 1 : 0) - (k.KeyS ? 1 : 0);
    const running = !!(k.ShiftLeft || k.ShiftRight);
    const moving = (ix !== 0 || iz !== 0) && !this.kicking;

    this.targetVel.set(0, 0, 0);

    if (this.kicking) {
      this.kickTimer -= dt;
      if (this.kickTimer <= 0) this.endKick();
    } else if (moving) {
      // Pravci relativno na kameru
      const yaw = this.data.cameraRig.components['third-person-camera'].yaw;
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw); // naprijed
      const rx =  Math.cos(yaw), rz = -Math.sin(yaw); // desno
      let dx = fx * iz + rx * ix;
      let dz = fz * iz + rz * ix;
      const len = Math.hypot(dx, dz);
      dx /= len; dz /= len;

      const speed = running ? this.data.runSpeed : this.data.walkSpeed;
      this.targetVel.set(dx * speed, 0, dz * speed);

      // Rotacija modela u pravcu kretanja (model gleda prema +Z; data-facing="180" za modele koji gledaju prema -Z)
      const mEl = this.getModel(), m = mEl.object3D;
      const targetYaw = Math.atan2(dx, dz) + THREE.MathUtils.degToRad(+mEl.dataset.facing || 0);
      m.rotation.y += angleDelta(m.rotation.y, targetYaw) * damp(this.data.turnSpeed, dt);

      animator.setState(running ? 'run' : 'walk');
    } else {
      animator.setState('idle');
    }

    // Glatko ubrzanje/kočenje (kod kicka brže zaustavljanje)
    const a = this.kicking ? this.data.accel * 2 : this.data.accel;
    this.velocity.lerp(this.targetVel, damp(a, dt));
    const pos = this.getPlayer().object3D.position;
    this.prevPos = (this.prevPos || new THREE.Vector3()).copy(pos);
    pos.addScaledVector(this.velocity, dt);

    // Jednostavan sudar sa ostalim karakterima (krug protiv kruga)
    const minD = this.data.radius * 2;
    this.data.players.forEach(other => {
      if (other === this.getPlayer()) return;
      const op = other.object3D.position;
      const ddx = pos.x - op.x, ddz = pos.z - op.z;
      const d = Math.hypot(ddx, ddz);
      if (d > 0.0001 && d < minD) {
        pos.x = op.x + ddx / d * minD;
        pos.z = op.z + ddz / d * minD;
      }
    });

    // Zidovi, stubovi i sto paviljona + visina poda (platforma i stepenik)
    const mgr = this.el.sceneEl.components['env-manager'];
    const world = mgr ? mgr.world() : (this.data.world && this.data.world.components.pavilion);
    if (world) {
      world.resolveMove(this.prevPos, pos, this.data.radius * 0.9);
      pos.y += (world.groundHeight(pos.x, pos.z, pos.y) - pos.y) * damp(18, dt);
    }
  }
});

/* =====================================================================
   5) MODEL-TEXTURE
   Ako GLTF stigne bez materijala/teksture, učitaj teksturu iz zasebne
   slike i stavi je na model (UV koordinate već postoje u modelu).
   ===================================================================== */
AFRAME.registerComponent('model-texture', {
  schema: {
    src:       { type: 'string', default: '' },
    normal:    { type: 'string', default: '' },   // opcione PBR mape
    roughnessMap: { type: 'string', default: '' },
    metalnessMap: { type: 'string', default: '' },
    roughness: { type: 'number', default: 0.85 },
    metalness: { type: 'number', default: 0 }
  },
  init() {
    const apply = () => this.apply(this.el.getObject3D('mesh'));
    if (this.el.getObject3D('mesh')) apply();
    else this.el.addEventListener('model-loaded', apply, { once: true });
  },
  apply(model) {
    if (!model || !this.data.src) return;
    let hasMap = false;
    model.traverse(o => { if (o.isMesh && o.material && o.material.map) hasMap = true; });
    if (hasMap) return; // model već ima teksturu – ništa ne diramo

    const loader = new THREE.TextureLoader(), d = this.data;
    const load = (src, srgb) => !src ? Promise.resolve(null) : new Promise(res => loader.load(src, tex => {
      tex.flipY = false;                      // glTF UV konvencija
      if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      res(tex);
    }, undefined, () => { console.error(`[model-texture] Tekstura "${src}" nije pronađena.`); this.el.emit('model-error', { src }); res(null); }));
    Promise.all([load(d.src, true), load(d.normal), load(d.roughnessMap), load(d.metalnessMap)]).then(([map, normalMap, roughnessMap, metalnessMap]) => {
      if (!map) return;
      model.traverse(o => {
        if (!o.isMesh) return;
        o.material = new THREE.MeshStandardMaterial({
          map, normalMap, roughnessMap, metalnessMap,
          roughness: roughnessMap ? 1 : d.roughness, metalness: metalnessMap ? 1 : d.metalness
        });
      });
    });
  }
});

      if (!this.isOpen && !this.backdrop.classList.contains('show') && this.backdrop.style.display === 'none') return;

      this.pivot.rotation.set(this.tilt, this.spinY, 0, 'XYZ');
      this.pr.render(this.pScene, this.pCam);
      this.raf = requestAnimationFrame(loop);
    };
    cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(loop);
  },

    if (!this.isOpen) return;
    this.isOpen = false;
    document.body.classList.remove('modal-open');
    this.backdrop.classList.remove('show');
    this.hideTimer = setTimeout(() => { this.backdrop.style.display = 'none'; cancelAnimationFrame(this.raf); }, 300);
  }
});

/* =====================================================================
   8) GLITCH-FOREST  (environment 2)
   Infinite procedural forest built in 5 m chunks around every character.
   Chunks rise out of the dark when a character comes near and sink away
   when nobody is close (same idea as the old hex tiles).
   - ground: shader with rainbow contour lines flowing around tree trunks
   - trees: dark trunk, rainbow rings at the base, vertical data streaks,
            point-cloud canopy in blue/violet
   - ferns (point clusters) and floating glyph columns
   Same API as the pavilion: groundHeight, resolveMove, cameraHit.
   ===================================================================== */
const FOREST_MAX_TREES = 48;

function hashRng(i, j, seed) { return mulberry32((i * 73856093) ^ (j * 19349663) ^ (seed * 83492791)); }

function dotTexture() {
  return canvasTex(64, (ctx, S) => {
    const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.45, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  }, false);
}
/** Tall strip of tiny coloured glyph rows (the "data" columns on the left of the image). */
function glyphTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 1024;
  const ctx = c.getContext('2d'), r = mulberry32(5);
  const cols = ['#ffffff', '#ff6fd8', '#6ff7ff', '#ffe46f', '#9d8bff', '#ff9a5c', '#7dff9a'];
  for (let y = 0; y < 1024; y += 9) {
    let x = 2 + r() * 6;
    while (x < 60) {
      const w = 2 + Math.floor(r() * 6);
      if (r() < 0.75) { ctx.fillStyle = cols[Math.floor(r() * cols.length)]; ctx.globalAlpha = 0.5 + r() * 0.5; ctx.fillRect(x, y, w, 5); }
      x += w + 1 + r() * 4;
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

AFRAME.registerComponent('glitch-forest', {
  schema: {
    targets: { type: 'selectorAll' },        // all characters
    cell:    { type: 'number', default: 5 },  // chunk size (m)
    radius:  { type: 'number', default: 14 }, // how far around each character the forest exists
    seed:    { type: 'number', default: 7 }
  },

  init() {
    this.ready = true;
    this.root = new THREE.Group();
    this.el.setObject3D('mesh', this.root);
    this.chunks = new Map();                  // "i,j" → { group, trees, glyphs, t, alive }
    this.time = 0;
    this.tmp = new THREE.Vector3();

    const dot = dotTexture();
    this.mat = {
      trunk:  new THREE.MeshStandardMaterial({ color: '#141726', roughness: 0.9 }),
      lines:  new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false }),
      leaves: new THREE.PointsMaterial({ size: 0.16, map: dot, vertexColors: true, transparent: true, alphaTest: 0.05, depthWrite: false, sizeAttenuation: true }),
      glyph:  new THREE.MeshBasicMaterial({ map: glyphTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
    };
    this.treeTemplates  = Array.from({ length: 6 }, (_, k) => this.makeTree(k));
    this.shrubTemplates = Array.from({ length: 4 }, (_, k) => this.makeShrub(k));
    this.glyphGeo = new THREE.PlaneGeometry(0.7, 1, 1, 1);

/* =====================================================================
   10) STARRY-VALLEY  (environment 3)
   Night sky over a sunlit green valley: winding gravel road, white

   endless forest plain fading into blue haze.

  float vRaw(float x, float z) {
    float s = max(0.0, 25.0 - z);

  /* ---------- oak forest (instanced): textured crowns + leaf cards + branched trunks ---------- */
  buildForest() {

      const px = x + (r() - 0.5) * 4.5, pz = z + (r() - 0.5) * 4.5, d = Math.abs(px - vRoadX(pz));

      const prob = d < 22 ? 0.05 : d < 30 ? 0.35 : 0.8;

  buildCypresses() {

  /* ---------- giant ivy-covered trees: limbs arching over the valley, huge canopy ---------- */
  buildGiants() {

  /* ---------- GPU grass: blades + meadow flowers around the active character ---------- */
  buildGrass() {
    const SEG = 4, base = new THREE.BufferGeometry(), pos = [], col = [], idx = [];

    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide });
    mat.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, this.grassUniforms);

        attribute vec2 aOff; attribute vec4 aRnd;
        uniform vec2 uCenter; uniform float uTime; uniform float uSize;
        ${VALLEY_GLSL}

        .replace('#include <beginnormal_vertex>', 'vec3 objectNormal = vec3(0.0, 1.0, 0.0);')
        .replace('#include <begin_vertex>', `

          vec2 wp = uCenter + rel;
          float fade = 1.0 - smoothstep(uSize * 0.32, uSize * 0.5, length(rel));
          float dr = abs(wp.x - vRoadX(wp.y));
          float roadK = smoothstep(1.55, 2.0, dr) + (1.0 - smoothstep(0.18, 0.32, dr)) * 0.45;   // none on the gravel, short in the middle strip
          float meadow = smoothstep(-15.0, 5.0, wp.y);

          float h = (0.1 + aRnd.x * 0.16 + meadow * (0.12 + aRnd.x * 0.22) + isFlower * 0.08) * fade * roadK * (1.0 - step(105.0, wp.x));

          float bend = p.y * p.y;
          vec3 transformed = vec3(wp.x + p.x * cy * (1.0 + isFlower * step(0.7, p.y) * 2.5) + bend * (wind + (aRnd.z - 0.5) * 0.25) * h,
                                  vHeight(wp.x, wp.y) + p.y * h,
                                  wp.y + p.x * sy * (1.0 + isFlower * step(0.7, p.y) * 2.5) + bend * wind * 0.6 * h);
          vFlower = isFlower * step(0.7, p.y);
          vTint = vec3(0.30 + aRnd.z * 0.1, 0.6 + aRnd.x * 0.16, 0.2 + aRnd.y * 0.05) * 0.9;
          vFlowerCol = aRnd.z < 0.2 ? vec3(1.0, 0.25, 0.25) : aRnd.z < 0.4 ? vec3(1.0, 0.85, 0.25) : aRnd.z < 0.6 ? vec3(1.0) : aRnd.z < 0.8 ? vec3(0.45, 0.55, 1.0) : vec3(0.85, 0.45, 1.0);
        `)
        .replace('void main() {', 'varying float vFlower; varying vec3 vTint; varying vec3 vFlowerCol;\nvoid main() {');
      shader.fragmentShader = shader.fragmentShader
        .replace('void main() {', 'varying float vFlower; varying vec3 vTint; varying vec3 vFlowerCol;\nvoid main() {')
        .replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb *= mix(vTint, vFlowerCol * 1.4, vFlower);');
    };
    const mesh = this.grass = new THREE.Mesh(g, mat);
    mesh.frustumCulled = false; mesh.receiveShadow = true;
    this.root.add(mesh);
  },

  tick(time, dtMs) {
    const cam = this.el.sceneEl.camera;
    if (cam) cam.getWorldPosition(this.sky.position);
    this.bright.material.size = 8 + Math.sin(time * 0.002) * 1.5;
    this.grassUniforms.uTime.value = time / 1000;
    const ctrl = this.el.sceneEl.querySelector('[player-controller]');
    const pl = ctrl && ctrl.components['player-controller'] && ctrl.components['player-controller'].getPlayer();
    if (pl) this.grassUniforms.uCenter.value.set(pl.object3D.position.x, pl.object3D.position.z);
  },

  /* ---------- API for controller / camera / env-manager ---------- */
  groundHeight(x, z) { return vHeight(x, z); },

  resolveMove(from, to, r) {
    const ci = Math.floor(to.x / 8), cj = Math.floor(to.z / 8);
    for (let j = cj - 1; j <= cj + 1; j++) for (let i = ci - 1; i <= ci + 1; i++) {
      const list = this.colliders.get(i + ',' + j); if (!list) continue;
      for (const c of list) {
        const dx = to.x - c.x, dz = to.z - c.z, d = Math.hypot(dx, dz), min = c.r + r;
        if (d < min && d > 1e-5) { to.x = c.x + dx / d * min; to.z = c.z + dz / d * min; }
      }
    }
    for (const b of this.boxes) {
      const dx = to.x - b.x, dz = to.z - b.z;
      const lx = dx * b.cos - dz * b.sin, lz = dx * b.sin + dz * b.cos;
      const cx = THREE.MathUtils.clamp(lx, -b.hx, b.hx), cz = THREE.MathUtils.clamp(lz, -b.hz, b.hz);
      const ex = lx - cx, ez = lz - cz, d = Math.hypot(ex, ez);

        else { const px = b.hx - Math.abs(lx), pz = b.hz - Math.abs(lz);

    to.x = THREE.MathUtils.clamp(to.x, vGiantX(to.z) + 5, 100);
  },

  cameraHit() { return null; },

  spawnPoints() {
    const z = VALLEY.zTop - 6, x = vRoadX(z);

  }
});

/* =====================================================================
   11) MEGASTRUCTURE  (environment 4)
   Endless brutalist megastructure (Escher-like): an identical 3D lattice
   cell repeated in every direction – window-gridded towers whose rooftops
   are bases, steel-truss walkway bridges between them, heavy concrete
   girders one level up, and inverted skyscrapers hanging from the girders
   that glide back and forth on their own. Golden statue on every rooftop.
   Lattice vectors: (32,0,0), (0,0,32), (16,24,16) → the level above is
   shifted half a cell, so the girders plug into the towers of the level above.
   Rendering: one InstancedMesh per material; the block of cells snaps with
   the character (cells are identical, so the snap is invisible).
   Walkable: rooftops + bridge decks of the character's level (y = 0).
   ===================================================================== */
const MEGA = { P: 32, PY: 24, roof: 6, deck: 2, girderY: 14, towerRange: 4.9 };

/* ---- textures ---- */
function megaFacadeTexture() {                     // concrete panels + window grid + grime, 1 tile ≈ 8 m
  return canvasTex(512, (ctx, S) => {
    const r = mulberry32(401), n = fbmFactory(4, 4, 402);
    const img = ctx.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const v = 178 + (n(x / S, y / S) - 0.5) * 70, i = (y * S + x) * 4;
      img.data[i] = v + 6; img.data[i + 1] = v + 2; img.data[i + 2] = v - 10; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const fl = S / 4;                                 // 4 floors per tile
    for (let f = 0; f < 4; f++) {
      const y = f * fl;
      ctx.fillStyle = 'rgba(120,112,100,.55)'; ctx.fillRect(0, y + fl - 8, S, 8);        // floor slab line
      const bays = 6, bw = S / bays;
      for (let b = 0; b < bays; b++) {
        const x = b * bw;
        if (r() < 0.18) { ctx.fillStyle = 'rgba(205,198,184,.9)'; ctx.fillRect(x + 4, y + 6, bw - 8, fl - 16); continue; }   // blank panel
        ctx.fillStyle = '#2f3134'; ctx.fillRect(x + 8, y + 12, bw - 16, fl - 30);       // glass
        ctx.fillStyle = 'rgba(160,170,180,.25)'; ctx.fillRect(x + 8, y + 12, (bw - 16) * 0.4, fl - 30);
        ctx.strokeStyle = '#8f877a'; ctx.lineWidth = 2;
        for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x + 8 + k * (bw - 16) / 4, y + 12); ctx.lineTo(x + 8 + k * (bw - 16) / 4, y + fl - 18); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(x + 8, y + 12 + (fl - 30) / 2); ctx.lineTo(x + bw - 8, y + 12 + (fl - 30) / 2); ctx.stroke();
        if (r() < 0.25) { ctx.fillStyle = '#c7bfae'; ctx.fillRect(x + 10, y + fl - 26, bw - 20, 10); }   // balcony box
      }
    }
    for (let i = 0; i < 90; i++) {                    // grime / rust streaks
      const x = r() * S, y = r() * S, h = 30 + r() * 120;
      const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, `rgba(${r() < 0.3 ? '120,70,35' : '60,55,50'},.35)`); g.addColorStop(1, 'rgba(60,55,50,0)');
      ctx.fillStyle = g; ctx.fillRect(x, y, 2 + r() * 6, h);
    }
  });
}
function megaConcreteTexture() {                   // plain weathered concrete with formwork joints, 1 tile ≈ 6 m
  return canvasTex(512, (ctx, S) => {
    const r = mulberry32(410), n = fbmFactory(4, 5, 411), img = ctx.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const v = 190 + (n(x / S, y / S) - 0.5) * 80 + (r() - 0.5) * 10, i = (y * S + x) * 4;

}
function megaSteelTexture() {
  return canvasTex(128, (ctx, S) => {

function megaHazardTexture() {

/* ---- geometry helpers: boxes with UVs scaled to world size, merged per material ---- */
function megaBox(w, h, d, x, y, z, tile = 6, rotY = 0) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const faces = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];          // +x,-x,+y,-y,+z,-z
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * faces[f][0] / tile, uv.getY(i) * faces[f][1] / tile); }
  if (rotY) g.rotateY(rotY);
  g.translate(x, y, z);
  return g;
}
/** Bar between two points (truss members, cables). */
function megaBar(a, b, t) {

/** Warren truss along +z from z0 to z1 at x, between yb (bottom chord) and yt (top chord). */
function megaTruss(out, x, yb, yt, z0, z1, bay = 3, t = 0.3) {
  const V = (z, y) => new THREE.Vector3(x, y, z);
  out.push(megaBar(V(z0, yb), V(z1, yb), t), megaBar(V(z0, yt), V(z1, yt), t));
  const n = Math.max(1, Math.round((z1 - z0) / bay));
  for (let i = 0; i < n; i++) {
    const za = z0 + (z1 - z0) * i / n, zb = z0 + (z1 - z0) * (i + 1) / n;
    out.push(megaBar(V(za, i % 2 ? yt : yb), V(zb, i % 2 ? yb : yt), t * 0.75));

function megaMerge(list) { return mergeGeos(list.map(g => { const m = g.index ? g.toNonIndexed() : g; return m; })); }
/** Rotate a list of geometries 90° about Y (to make the x-direction copy of a z-direction part). */
function megaRot(list, ang) { return list.map(g => g.clone().rotateY(ang)); }

/* ---------- staircases (megastructure) ----------
   Designed in the "E frame" (cell-local, rooftop at origin):
   two lanes along z: A x∈[20.6,22.4], B x∈[23.6,25.4]; flights alternate A(+z) / B(−z),
   landings at the +z end (z 6.6–8.2) and −z end (z −6.2..−4.6).
   Bottom: level-0 bridge along x (z≈0). Top: level+1 bridge along z (x≈16, y = 24).
   SHORT = 3 flights (~40°), LONG = 5 flights (~25°). The LONG one is rotated −90° (runs along x). */
const STAIR = { A: [20.6, 22.4], B: [23.6, 25.4], zp: 7.0, zm: -5.0, z0: 2.4, Lp: [6.6, 8.2], Lm: [-6.2, -4.6] };

/** Walk primitives of a stair in the E frame. Each: rect + margins {x0,x1,z0,z1} + height(x,z). */
function stairPrims(nFlights) {
  const S = STAIR, run = (S.zp - S.z0) + (nFlights - 1) * (S.zp - S.zm), s = MEGA.PY / run, out = [];
  const flat = (x0, x1, z0, z1, y, m) => out.push({ x0, x1, z0, z1, m, h: () => y });
  flat(S.A[0], S.A[1], 0.9, 2.9, 0, { x0: 0.15, x1: 0.15 });                                     // step-off from the bridge
  let y = 0;
  for (let f = 0; f < nFlights; f++) {
    const up = f % 2 === 0, lane = up ? S.A : S.B, za = f === 0 ? S.z0 : (up ? S.zm : S.zp), zb = up ? S.zp : S.zm, y0 = y;
    y += Math.abs(zb - za) * s;
    out.push({ x0: lane[0], x1: lane[1], z0: Math.min(za, zb), z1: Math.max(za, zb), m: { x0: 0.15, x1: 0.15 },
      h: (x, z) => y0 + THREE.MathUtils.clamp(Math.abs(z - za), 0, Math.abs(zb - za)) * s });
    if (f < nFlights - 1) {
      const L = up ? S.Lp : S.Lm, yl = y;
      flat(S.A[0], S.B[1], L[0], L[1], yl, up ? { x0: 0.15, x1: 0.15, z1: 0.15 } : { x0: 0.15, x1: 0.15, z0: 0.15 });
    }
  }
  // top: landing over lane A and a walkway onto the level+1 bridge
  flat(S.A[0], S.A[1], S.Lp[0], S.Lp[1], MEGA.PY, { x1: 0.15, z1: 0.15 });
  flat(16.9, S.A[1], S.zp, S.Lp[1], MEGA.PY, { z0: 0.15, z1: 0.15 });
  return out;
}

/** Visual geometry of a stair in the E frame, pushed into the cell's material parts. */
function stairGeometry(parts, nFlights) {
  const S = STAIR, run = (S.zp - S.z0) + (nFlights - 1) * (S.zp - S.zm), s = MEGA.PY / run, V = (x, y, z) => new THREE.Vector3(x, y, z);
  const railSide = (x, za, ya, zb, yb) => {                                      // sloped handrail + posts
    parts.steel.push(megaBar(V(x, ya + 1.0, za), V(x, yb + 1.0, zb), 0.06), megaBar(V(x, ya + 0.5, za), V(x, yb + 0.5, zb), 0.04));
    const n = Math.max(1, Math.round(Math.abs(zb - za) / 1.5));
    for (let i = 0; i <= n; i++) { const t = i / n, z = za + (zb - za) * t, y = ya + (yb - ya) * t; parts.steel.push(megaBox(0.05, 1.0, 0.05, x, y + 0.5, z, 1)); }
  };
  const landing = (x0, x1, z0, z1, y, rails, colDown = 7) => {
    parts.concrete.push(megaBox(x1 - x0, 0.3, z1 - z0, (x0 + x1) / 2, y - 0.15, (z0 + z1) / 2, 3));
    parts.hazard.push(megaBox(x1 - x0 + 0.02, 0.08, 0.25, (x0 + x1) / 2, y - 0.04, rails.includes('z0') ? z1 - 0.12 : z0 + 0.12, 1));
    for (const cx of [x0 + 0.25, x1 - 0.25]) for (const cz of [z0 + 0.25, z1 - 0.25]) parts.steel.push(megaBox(0.22, colDown, 0.22, cx, y - 0.3 - colDown / 2, cz, 2));
    const edge = (ax, az, bx, bz) => { parts.steel.push(megaBar(V(ax, y + 1.0, az), V(bx, y + 1.0, bz), 0.06));
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, bz - az) / 1.2)); for (let i = 0; i <= n; i++) parts.steel.push(megaBox(0.05, 1.0, 0.05, ax + (bx - ax) * i / n, y + 0.5, az + (bz - az) * i / n, 1)); };
    if (rails.includes('x0')) edge(x0 + 0.05, z0, x0 + 0.05, z1);
    if (rails.includes('x1')) edge(x1 - 0.05, z0, x1 - 0.05, z1);
    if (rails.includes('z0')) edge(x0, z0 + 0.05, x1, z0 + 0.05);
    if (rails.includes('z1')) edge(x0, z1 - 0.05, x1, z1 - 0.05);
  };
  const flight = (lane, za, zb, ya, yb) => {
    const x0 = lane[0] + 0.05, x1 = lane[1] - 0.05, w = x1 - x0, cx = (x0 + x1) / 2, dz = Math.sign(zb - za);
    const n = Math.max(2, Math.round((yb - ya) / 0.19)), tz = (zb - za) / n, ty = (yb - ya) / n;
    for (let i = 0; i < n; i++) parts.steel.push(megaBox(w - 0.1, 0.05, Math.abs(tz) + 0.04, cx, ya + ty * (i + 1) - 0.025, za + tz * (i + 0.5), 1));   // treads
    for (const sx of [x0, x1]) parts.steel.push(megaBar(V(sx, ya - 0.25, za), V(sx, yb - 0.25, zb), 0.12));                                          // stringers
    railSide(x0 + 0.03, za, ya, zb, yb); railSide(x1 - 0.03, za, ya, zb, yb);
  };
  let y = 0;
  for (let f = 0; f < nFlights; f++) {
    const up = f % 2 === 0, lane = up ? S.A : S.B, za = f === 0 ? S.z0 : (up ? S.zm : S.zp), zb = up ? S.zp : S.zm, y0 = y;
    y += Math.abs(zb - za) * s;
    flight(lane, za, zb, y0, y);
    if (f < nFlights - 1) landing(S.A[0], S.B[1], (up ? S.Lp : S.Lm)[0], (up ? S.Lp : S.Lm)[1], y, up ? ['x0', 'x1', 'z1'] : ['x0', 'x1', 'z0']);
  }
  landing(S.A[0], S.A[1], S.Lp[0], S.Lp[1], MEGA.PY, ['x1', 'z1'], 4);
  landing(18.2, S.A[0], S.zp, S.Lp[1], MEGA.PY, ['z0', 'z1'], 2);
  parts.steel.push(megaBox(S.A[1] - S.A[0], 0.25, 2.2, (S.A[0] + S.A[1]) / 2, -0.12, 1.9, 1));             // step-off plate at the bottom
}

  /** Height of the walkable surface under (x,z) closest to y (steps up ≤ 0.75 m, down ≤ 1.2 m), or null. */
  surfaceAt(x, z, y, r) {
    const P = MEGA.P, PY = MEGA.PY, kp = Math.round(y / PY);
    let best = null, bd = 1e9, roofU = 0, roofW = 0, isRoof = false;
    for (let k = kp - 1; k <= kp + 1; k++) {
      const ly = y - k * PY;
      let lx = x - k * P / 2, lz = z - k * P / 2;
      lx = ((lx % P) + P * 1.5) % P - P / 2; lz = ((lz % P) + P * 1.5) % P - P / 2;
      for (const ox of [-P, 0, P]) for (const oz of [-P, 0, P]) {
        const px = lx + ox, pz = lz + oz;
        for (const pr of this.prims) {
          const qx = pr.rot ? pz : px, qz = pr.rot ? -px : pz, m = pr.m;
          if (qx < pr.x0 + (m.x0 !== undefined ? m.x0 + r : 0) || qx > pr.x1 - (m.x1 !== undefined ? m.x1 + r : 0)) continue;
          if (qz < pr.z0 + (m.z0 !== undefined ? m.z0 + r : 0) || qz > pr.z1 - (m.z1 !== undefined ? m.z1 + r : 0)) continue;
          const h = pr.h(qx, qz), d = h - ly;
          if (d > 0.75 || d < -1.2) continue;
          if (Math.abs(d) < bd) { bd = Math.abs(d); best = h + k * PY; isRoof = pr.id === 'roof'; roofU = px; roofW = pz; }
        }
      }
    }
    if (best !== null && isRoof && r > 0) {                                       // rooftop props: statue, AC units, antenna
      for (const [px, pz, pr] of [[3.9, -3.9, 1.0], [-4.2, -4.2, 1.2], [4.2, 4.2, 1.2], [-4.3, 4.2, 0.35]]) if (Math.hypot(roofU - px, roofW - pz) < pr + r) return null;
    }
    return best;
  },

  buildInstances() {

    this.cellCount = n;
    this.cellMeshes = [];

      const gi = Math.round((px - k * P / 2) / P) + i, gj = Math.round((pz - k * P / 2) / P) + j;

  tick(time, dtMs) {

    let idx = 0;

      m.makeTranslation(c.ox + P / 2, c.oy, c.oz + a);                           // on the girder along z (x = 30)
      this.towerMeshes.forEach(im => im.setMatrixAt(idx, m)); idx++;
      m.makeTranslation(c.ox + b, c.oy, c.oz + P / 2).multiply(rot);              // on the girder along x (z = 30)
      this.towerMeshes.forEach(im => im.setMatrixAt(idx, m)); idx++;
    }
    this.towerMeshes.forEach(im => { im.instanceMatrix.needsUpdate = true; });
    this.mat.lights.color.setRGB(Math.sin(t * 3) > 0.2 ? 1 : 0.25, 0.12, 0.08);   // blinking warning lights

    // dust follows the character (wrapping box)
    this.dust.position.set(Math.floor(pp.x / 40) * 40, pp.y, Math.floor(pp.z / 40) * 40);
    this.dust.rotation.y = t * 0.01;
  },

  /* ---------- API ---------- */
  groundHeight(x, z, y) {
    if (y === undefined) return -1e9;                                             // camera: no terrain clamp here
    const h = this.surfaceAt(x, z, y, 0);
    return h === null ? y : h;

    if (ok(to.x, to.z)) return;
    if (!ok(from.x, from.z)) return;
    if (ok(to.x, from.z)) { to.z = from.z; return; }
    if (ok(from.x, to.z)) { to.x = from.x; return; }
    to.x = from.x; to.z = from.z;
  },

  cameraHit() { return null; },

  spawnPoints() { return [[0, 0], [1.4, 0.8], [-1.4, 0.8], [0, 1.7], [1.4, 2.2]]; }
});

/* =====================================================================
   12) LOBBY  (environment 0 – shown when the website opens)
   Round room Ø 12 m, 8 m high: navy metal wall panels with a dense grid of
   glowing LED dots that curve into the ceiling, a wavy ceiling opening with an
   LED strip, LED ring at the floor, glossy black mirror floor (real planar
   reflection), glowing ribbed reception table (h 86.5 cm, Ø 160 cm) and the
   spinning DE-YAN logo (deyan_logo.glb) 2.2 m above the floor.
   API: groundHeight, resolveMove, cameraHit, spawnPoints.
   ===================================================================== */
const LOBBY = { R: 6.0, H: 8, wallStraight: 5.2, topR: 4.6, tableR: 0.8, tableH: 0.865, logoY: 2.6, logoW: 4.8, tile: 0.8 };

/** Planar mirror (based on three.js Reflector) – renders the scene mirrored into a texture. */
class LobbyMirror extends THREE.Mesh {
  constructor(geometry, { size = 1024, color = new THREE.Color('#05070c'), strength = 0.55 } = {}) {
    const rt = new THREE.WebGLRenderTarget(size, size, { type: THREE.HalfFloatType });
    const textureMatrix = new THREE.Matrix4();
    const material = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: rt.texture }, textureMatrix: { value: textureMatrix }, color: { value: color },
                  strength: { value: strength }, texel: { value: 1.6 / size } },
      vertexShader: `
        uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vXZ;
        void main() { vUv = textureMatrix * vec4(position, 1.0); vXZ = position.xy;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform vec3 color; uniform float strength, texel; varying vec4 vUv; varying vec2 vXZ;
        void main() {
          vec2 uv = vUv.xy / vUv.w;
          vec3 r = texture2D(tDiffuse, uv).rgb * 0.36
                 + (texture2D(tDiffuse, uv + vec2(texel, 0.0)).rgb + texture2D(tDiffuse, uv - vec2(texel, 0.0)).rgb
                 +  texture2D(tDiffuse, uv + vec2(0.0, texel)).rgb + texture2D(tDiffuse, uv - vec2(0.0, texel)).rgb) * 0.16;
          float grain = fract(sin(dot(floor(vXZ * 220.0), vec2(12.9898, 78.233))) * 43758.5453) * 0.012;  // polished stone micro-grain
          gl_FragColor = vec4(color + grain + r * strength, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
    super(geometry, material);
    this.isLobbyMirror = true;
    this.rt = rt; this.textureMatrix = textureMatrix; this.camera = new THREE.PerspectiveCamera();
    const plane = new THREE.Plane(), normal = new THREE.Vector3(), mirrorPos = new THREE.Vector3(), camPos = new THREE.Vector3(),
      rot = new THREE.Matrix4(), look = new THREE.Vector3(1, 0, 0), clip = new THREE.Vector4(), view = new THREE.Vector3(),
      target = new THREE.Vector3(), q = new THREE.Vector4(), vc = this.camera;
    this.onBeforeRender = (renderer, scene, camera) => {
      mirrorPos.setFromMatrixPosition(this.matrixWorld); camPos.setFromMatrixPosition(camera.matrixWorld);
      rot.extractRotation(this.matrixWorld); normal.set(0, 0, 1).applyMatrix4(rot);
      view.subVectors(mirrorPos, camPos); if (view.dot(normal) > 0) return;
      view.reflect(normal).negate().add(mirrorPos);
      rot.extractRotation(camera.matrixWorld);
      look.set(0, 0, -1).applyMatrix4(rot).add(camPos);
      target.subVectors(mirrorPos, look).reflect(normal).negate().add(mirrorPos);
      vc.position.copy(view); vc.up.set(0, 1, 0).applyMatrix4(rot).reflect(normal); vc.lookAt(target);
      vc.far = camera.far; vc.updateMatrixWorld(); vc.projectionMatrix.copy(camera.projectionMatrix);
      textureMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1)
        .multiply(vc.projectionMatrix).multiply(vc.matrixWorldInverse).multiply(this.matrixWorld);
      // oblique near plane = mirror plane (nothing below the floor gets reflected)
      plane.setFromNormalAndCoplanarPoint(normal, mirrorPos).applyMatrix4(vc.matrixWorldInverse);
      clip.set(plane.normal.x, plane.normal.y, plane.normal.z, plane.constant);
      const pm = vc.projectionMatrix.elements;
      q.set((Math.sign(clip.x) + pm[8]) / pm[0], (Math.sign(clip.y) + pm[9]) / pm[5], -1, (1 + pm[10]) / pm[14]);
      clip.multiplyScalar(2 / clip.dot(q));
      pm[2] = clip.x; pm[6] = clip.y; pm[10] = clip.z + 1 - 0.003; pm[14] = clip.w;
      this.visible = false;
      const prevRT = renderer.getRenderTarget(), xr = renderer.xr.enabled, sh = renderer.shadowMap.autoUpdate;
      renderer.xr.enabled = false; renderer.shadowMap.autoUpdate = false;
      renderer.setRenderTarget(rt); renderer.state.buffers.depth.setMask(true);
      if (renderer.autoClear === false) renderer.clear();
      renderer.render(scene, vc);
      renderer.xr.enabled = xr; renderer.shadowMap.autoUpdate = sh; renderer.setRenderTarget(prevRT);
      const vp = camera.viewport; if (vp !== undefined) renderer.state.viewport(vp);
      this.visible = true;
    };
  }
}
